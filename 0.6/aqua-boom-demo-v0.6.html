<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" name="viewport"/>
<meta content="#dfe9f2" name="theme-color"/>
<meta content="dark light" name="color-scheme"/>
<meta content="Головоломка «Аква-Бум: Спасти Уму»: вращай стенд из прозрачных труб во все стороны, управляй водой, льдом, кислотой и квадратными шиберами, спаси Уму. Техно-демо v0.6, уровень «Первый поток»." name="description"/>
<meta content="yes" name="mobile-web-app-capable"/>
<title>Аква-Бум! Спасти Уму — техно-демо v0.6</title>
<!--
  АКВА-БУМ! СПАСТИ УМУ · техно-демо «Первый поток» (First Flow) · v0.6
  v0.6: stable water/acid/ice visuals; smooth edge-by-edge flow and gradual water-to-acid colour blending;
        rig-local Uma capsule and transparent 3-D pipe/joint meshes; free-angle constructor, unique start/exit and repeatable water/acid chambers;
        named My Levels save/load; 3-D gate, cooler/heater, temperature-driven phases, arcball rotation and horizontal lab parallax.
        Version shown in menu/help/file name.
  Один файл, без внешних зависимостей. Canvas 2D + собственная 3D-математика (подход Мат-Бум 1).
  Фон-окружение — процедурный «лабораторный комплекс ГидроЛаб-7» вместо космоса Мат-Бум 3 (тот же принцип: слои+параллакс вокруг арены).
  UI-хром (звук/язык/тема/меню), внешний arcball-поворот кватернионом по принципу сферы Мат-Бум 3.
  Физика: граф труб (PipeGraph/PipeNode/LiquidFlow по ТЗ), НЕ реальная гидродинамика. 30 Гц, детерминированно.
  Платформы: код не противоречит правилам Яндекс Игр и VK Mini Apps:
   - звук стоп при потере фокуса (Y 1.3 / VK pause), пауза по visibilitychange;
   - управление жестами + мышь + клавиатура (Y 1.6.1.5, 1.6.2.4); тап-цели >= 44px (Y 1.8);
   - нет выделения/контекстного меню на лонгтап (Y 1.6.1.8, 1.6.2.7); нет браузерного скролла (Y 1.10.2);
   - адаптив и поворот экрана без наложений (Y 1.10); прогресс и настройки в localStorage (Y 1.9);
   - никаких внешних URL, шрифтов и библиотек (Y 1.7; VK: HTTPS-хостинг, всё внутри index.html);
   - нет надписей «Яндекс Игры»/«VK» в интерфейсе; реклама не встроена в поле (только точки GameplayAPI-разметки);
   - адаптер PlatformAPI ниже: при появлении window.ysdk / VK Bridge подключит ready/gameplay/pause/resume/сохранения/язык.
   Для публикации: положить файл в корень архива как index.html (Y 1.22), имена файлов — латиницей без пробелов.
-->
<style>
/* ============ АКВА-БУМ: styles, dark+light themes, responsive ============ */
:root{
  --aqua:#28c4e8; --aqua2:#0e9cc4; --emerald:#3ddc84; --coral:#ff6a6a; --acid:#54e06a;
  --ink:#173042; --mut:#5b7386;
  --panel:rgba(255,255,255,.78); --panel-b:rgba(20,120,150,.28);
  --bg1:#e8f2f8; --bg2:#d7e6f0; --bg3:#c3d7e4;
  --card:linear-gradient(#ffffff,#eef7fb); --card-b:rgba(20,120,150,.45);
  --btnbg:rgba(255,255,255,.88); --btnb:rgba(14,120,150,.45);
  --hint:#1d4b60; --hint2:#0c7a4d; --dim:#6d8496;
  --shadow:0 6px 18px rgba(20,60,80,.18);
}
[data-theme="dark"]{
  --ink:#e6f4fa; --mut:#8fb3c4;
  --panel:rgba(10,26,38,.72); --panel-b:rgba(40,196,232,.30);
  --bg1:#081720; --bg2:#05101a; --bg3:#030a10;
  --card:linear-gradient(#10283a,#081724); --card-b:rgba(40,196,232,.5);
  --btnbg:rgba(12,34,48,.85); --btnb:rgba(40,196,232,.45);
  --hint:#bfe6f2; --hint2:#7df0b0; --dim:#6f93a5;
  --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none;
  background:linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column}
button{font-family:inherit;color:var(--ink);background:var(--btnbg);border:1px solid var(--btnb);
  border-radius:12px;min-height:44px;min-width:44px;padding:8px 14px;font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:var(--shadow);transition:filter .15s,transform .12s}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(160deg,var(--aqua),var(--aqua2));color:#04222e;border-color:rgba(255,255,255,.5);font-size:18px}
button.ghost{background:var(--panel);border-color:var(--panel-b)}
button.small{min-height:40px;min-width:40px;padding:6px 9px;font-size:13px;border-radius:10px}
@media (hover:hover){button:hover{filter:brightness(1.08)}}
/* ---------- chrome (top bar on every screen) ---------- */
:root{--chrome-h:50px}
#chrome{display:flex;justify-content:center;align-items:center;gap:8px;padding:6px 12px 2px;z-index:7;height:var(--chrome-h);flex:0 0 auto}
.chrome-c{display:flex;gap:6px;align-items:center}
#btn-back{min-width:44px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.ico-btn{min-width:44px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ico{width:22px;height:22px;vertical-align:middle;pointer-events:none}
.ico-btn.off img.ico{opacity:.4}
.mute-slash{display:none;position:absolute;left:11px;top:50%;width:22px;height:3px;background:var(--coral);
  transform:rotate(-45deg);border-radius:2px;pointer-events:none}
.ico-btn.off .mute-slash{display:block}
#lang-lbl{font-weight:800;letter-spacing:.5px}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}
.screen-scroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.logo{font-size:clamp(34px,9vw,64px);font-weight:900;letter-spacing:2px;text-align:center;
  color:var(--aqua2);text-shadow:0 2px 0 #fff,0 4px 14px rgba(20,160,200,.35)}
[data-theme="dark"] .logo{color:var(--aqua);text-shadow:0 0 18px rgba(40,196,232,.55),0 2px 3px #000}
.h1sub{font-size:clamp(15px,2.4vw + 8px,26px);letter-spacing:5px;color:var(--hint);font-weight:700;text-align:center}
.menu-actions{display:flex;flex-direction:column;gap:10px;width:min(86vw,340px);margin-top:8px}
.menu-actions button{width:100%}
.ver{font-size:11px;color:var(--dim);margin-top:10px;text-align:center}
.scr-title{font-size:clamp(20px,4vw,30px);letter-spacing:2px;text-align:center;color:var(--hint);margin:14px 8px 6px}
.sub{color:var(--mut);font-size:14px;text-align:center;padding:0 14px}
.helpbox{max-width:620px;margin:6px auto 26px;background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.helpbox h3{font-size:15px;letter-spacing:1px;color:var(--aqua2);margin:10px 0 6px}
[data-theme="dark"] .helpbox h3{color:var(--aqua)}
.helpbox p,.helpbox li{font-size:14px;line-height:1.5;color:var(--ink)}
.helpbox ul{padding-left:20px}
.chip{display:inline-block;padding:1px 8px;border-radius:8px;font-weight:700;font-size:12px;margin-right:6px}
.chip.w{background:rgba(40,140,255,.18);color:#1668c8}
.chip.a{background:rgba(84,224,106,.2);color:#1d9436}
.chip.i{background:rgba(160,220,255,.25);color:#2a7fa8}
[data-theme="dark"] .chip.w{color:#7cc4ff}
[data-theme="dark"] .chip.a{color:#8df09c}
[data-theme="dark"] .chip.i{color:#bfe8ff}
/* ---------- game screen ---------- */
#scr-game{position:fixed;inset:0;display:none;z-index:4;flex-direction:column}
#scr-game.on{display:flex}
#stage{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
#hud-top{position:absolute;top:calc(var(--chrome-h) + 2px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:6;pointer-events:none}
#hud-top button{pointer-events:auto}
#btn-freeze{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;border-color:rgba(90,190,255,.6)}
#btn-freeze .fl{font-size:10px;letter-spacing:1px;font-weight:800}
#btn-freeze.hot{border-color:var(--aqua);box-shadow:0 0 14px rgba(40,196,232,.55)}
#btn-freeze:disabled{opacity:.55}
#freezeRing{width:26px;height:26px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));
  z-index:6;pointer-events:none;max-width:92vw;text-align:center}
#hint1{font-size:clamp(14px,2.6vw,18px);font-weight:700;color:var(--hint);background:var(--panel);
  border:1px solid var(--panel-b);border-radius:14px;padding:8px 16px;box-shadow:var(--shadow);display:inline-block}
#hint1.terr{color:var(--coral)}
#dragHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));
  font-size:11px;color:var(--dim);z-index:5;pointer-events:none;text-align:center;max-width:90vw;
  background:var(--panel);border-radius:10px;padding:3px 10px;opacity:.9}
#ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;z-index:6}
#ctrl button{min-width:54px;min-height:48px;font-size:22px;border-radius:14px}
#ctrl button.rot:active{background:var(--aqua)}
#bGate{font-size:19px;font-weight:900;line-height:1}
#bGate.placing{background:linear-gradient(160deg,#ffb17a,#ff7168);color:#421811;border-color:#fff;box-shadow:0 0 15px rgba(255,113,104,.58)}
#stats{position:absolute;top:calc(var(--chrome-h) + 52px);right:10px;z-index:6;font-size:10px;line-height:1.45;
  color:var(--dim);background:var(--panel);border:1px solid var(--panel-b);border-radius:10px;padding:5px 8px;
  pointer-events:auto;cursor:pointer;white-space:pre;font-family:Consolas,monospace}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--card-b);border-radius:16px;padding:12px 22px;
  font-size:16px;font-weight:700;color:var(--hint);box-shadow:var(--shadow);text-align:center}
/* ---------- v0.6 constructor ---------- */
#constructorPanel{position:absolute;left:10px;top:calc(var(--chrome-h) + 50px);z-index:8;width:min(350px,calc(100vw - 20px));max-height:47vh;overflow:auto;padding:10px;border-radius:16px;background:var(--panel);border:1px solid var(--panel-b);box-shadow:var(--shadow);backdrop-filter:blur(8px);touch-action:pan-y}
#constructorPanel[hidden]{display:none}
.ctor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--hint);font-size:13px;letter-spacing:.5px}
#ctor-back{min-width:36px;min-height:36px;padding:4px}
#ctor-hint{font-size:11px;line-height:1.35;color:var(--mut);padding:4px 0 7px}
.ctor-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.ctor-grid button,.ctor-modules button{min-width:0;min-height:38px;padding:5px 4px;font-size:10px;line-height:1.15;border-radius:9px;box-shadow:none}
.ctor-grid button.selected,.ctor-modules button.selected{outline:2px solid var(--aqua2);background:rgba(40,196,232,.28)}
.ctor-grid button[data-ctor-tool="cooler"]{border-color:#3b9cff}
.ctor-grid button[data-ctor-tool="heater"]{border-color:#ff6b55}
.ctor-modules{display:flex;gap:5px;margin-top:6px}
.ctor-modules[hidden]{display:none}
.ctor-modules button{flex:1}
.ctor-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}
.ctor-actions button{min-height:36px;padding:5px 8px;font-size:11px;box-shadow:none}
#scr-game.constructor-mode #btn-freeze,#scr-game.constructor-mode #hint,#scr-game.constructor-mode #dragHint,#scr-game.constructor-mode #bGate{display:none!important}
#scr-game.constructor-mode #stats{display:none!important}
@media(max-width:560px){#constructorPanel{top:calc(var(--chrome-h) + 46px);max-height:42vh;width:min(330px,calc(100vw - 18px));left:9px}.ctor-grid button{font-size:9px}}
#constructorPanel input[type="range"]{width:100%;accent-color:var(--aqua2);touch-action:auto}
.ctor-angle-row{display:grid;grid-template-columns:auto 1fr 42px;gap:7px;align-items:center;margin-top:7px;font-size:10px;color:var(--mut)}
#ctor-selected{font-size:10px;color:var(--hint);min-height:14px;margin-top:4px}
#ctor-delete{color:#a52d32;border-color:rgba(220,70,70,.55)}
.levels-box{width:min(92vw,680px);margin:0 auto 26px;padding:14px;background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;box-shadow:var(--shadow)}
.level-save-row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.level-save-row input{flex:1;min-width:0;min-height:44px;border:1px solid var(--btnb);border-radius:10px;padding:8px 12px;font:inherit;color:var(--ink);background:var(--btnbg);user-select:text;-webkit-user-select:text;touch-action:auto}
.level-card{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 2px;border-top:1px solid var(--panel-b)}
.level-card .lname{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.level-card button{min-height:36px;min-width:36px;padding:5px 8px;font-size:11px;box-shadow:none}
#levels-empty{margin-top:10px}
@media(max-width:560px){.level-card{grid-template-columns:1fr auto auto}.level-card .l-edit{display:none}}
/* ---------- pipe modules screen (v0.6) ---------- */
.mods-sub{max-width:680px;margin:0 auto 12px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink);opacity:.85}
.mods-statebar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 14px;max-width:680px}
.mods-statebar button{padding:7px 13px;font-size:12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px}
.mods-statebar button .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.mods-statebar button.on{background:var(--aqua);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.mods-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:780px;margin:0 auto 24px}
@media(min-width:780px){.mods-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mod-cell{background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;padding:8px 10px 7px;box-shadow:var(--shadow)}
.mod-cell canvas{width:100%;height:auto;display:block;border-radius:10px}
.mod-cell .mname{font-size:12px;font-weight:700;color:var(--ink);margin-top:6px}
.mod-cell .mmeta{font-size:10px;color:var(--ink);opacity:.7}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(6,20,30,.45);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.obox{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:22px 24px;
  width:min(92vw,420px);text-align:center;box-shadow:var(--shadow);max-height:92vh;overflow-y:auto}
.obox h1{font-size:clamp(22px,5vw,32px);letter-spacing:2px;margin-bottom:8px;color:var(--hint)}
.obox p{font-size:14px;color:var(--mut);margin:4px 0}
.obox .btns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
#umaWin{width:150px;height:150px;margin:2px auto}
.reward{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:12px;font-weight:800;font-size:14px;
  background:linear-gradient(160deg,rgba(40,196,232,.25),rgba(61,220,132,.25));border:1px solid var(--card-b);color:var(--hint)}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.overlay.on .obox{animation:pop .3s ease-out}
@keyframes shakeS{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
.shakeS{animation:shakeS .3s linear}
</style>
</head>
<body>

<div id="chrome">
  <div class="chrome-c">
    <button class="ghost small" id="btn-back" hidden type="button"></button>
    <button class="ghost small ico-btn" id="btn-sound" type="button"><span class="mute-slash"></span></button>
    <button class="ghost small ico-btn" id="btn-lang" type="button"><span id="lang-lbl">EN</span></button>
    <button class="ghost small ico-btn" id="btn-theme" type="button"></button>
  </div>
</div>

<section class="screen on" id="scr-start"><div class="screen-scroll"><div class="center">
  <div class="logo" id="m-logo">АКВА-БУМ!</div>
  <div class="h1sub" id="m-sub">СПАСТИ УМУ</div>
  <div class="menu-actions">
    <button class="primary" id="b-play" type="button"></button>
    <button id="b-constructor" type="button"></button>
    <button id="b-levels" type="button"></button>
    <button id="b-help" type="button"></button>
    <button id="b-mods" type="button"></button>
  </div>
  <p class="ver" id="m-ver"></p>
</div></div></section>

<section class="screen" id="scr-help"><div class="screen-scroll">
  <h2 class="scr-title" id="help-title">КАК ИГРАТЬ</h2>
  <div class="helpbox" id="help-body"></div>
  <p class="ver" id="help-footer" style="text-align:center"></p>
</div></section>

<section class="screen" id="scr-levels"><div class="screen-scroll">
  <h2 class="scr-title" id="levels-title"></h2>
  <p class="mods-sub" id="levels-sub"></p>
  <div class="levels-box">
    <div class="level-save-row"><input id="level-name" type="text" maxlength="32" autocomplete="off"/><button class="primary small" id="level-save-current" type="button"></button></div>
    <div id="saved-levels"></div>
    <p class="ver" id="levels-empty"></p>
  </div>
</div></section>

<section class="screen" id="scr-mods"><div class="screen-scroll">
  <h2 class="scr-title" id="mods-title"></h2>
  <p class="mods-sub" id="mods-sub"></p>
  <div class="mods-statebar" id="mods-bar"></div>
  <div class="mods-grid" id="mods-grid"></div>
  <p class="ver" id="mods-footer" style="text-align:center"></p>
</div></section>

<section id="scr-game">
  <div id="shaker" style="display:contents">
    <div id="stage"><canvas id="gl"></canvas></div>
    <aside id="constructorPanel" hidden aria-label="Constructor">
      <div class="ctor-head"><strong id="ctor-title"></strong><button class="small ghost" id="ctor-back" type="button" aria-label="Back">←</button></div>
      <p id="ctor-hint"></p>
      <div class="ctor-grid" id="ctor-tools">
        <button type="button" data-ctor-tool="pipe"></button>
        <button type="button" data-ctor-tool="water"></button>
        <button type="button" data-ctor-tool="acid"></button>
        <button type="button" data-ctor-tool="empty"></button>
        <button type="button" data-ctor-tool="gate"></button>
        <button type="button" data-ctor-tool="cooler"></button>
        <button type="button" data-ctor-tool="heater"></button>
        <button type="button" data-ctor-tool="waterRoom"></button>
        <button type="button" data-ctor-tool="acidRoom"></button>
        <button type="button" data-ctor-tool="startRoom"></button>
        <button type="button" data-ctor-tool="finishRoom"></button>
      </div>
      <div class="ctor-modules" id="ctor-modules">
        <button type="button" data-part="straight"></button>
        <button type="button" data-part="elbow"></button>
        <button type="button" data-part="tee"></button>
        <button type="button" data-part="loop"></button>
      </div>
      <div class="ctor-angle-row"><label id="ctor-angle-label" for="ctor-angle"></label><input id="ctor-angle" type="range" min="0" max="359" step="1" value="0"/><output id="ctor-angle-value">0°</output></div>
      <p id="ctor-selected"></p>
      <div class="ctor-actions">
        <button class="ghost small" id="ctor-delete" type="button"></button>
        <button class="primary small" id="ctor-test" type="button"></button>
        <button class="ghost small" id="ctor-save" type="button"></button>
        <button class="ghost small" id="ctor-clear" type="button"></button>
      </div>
    </aside>
    <div id="hud-top">

<script>
/* ===== pipes-lib v0.6 · модули труб style_01 «Pixar Glass» =====
   Тот же код рисует трубы в игре и в наборе модулей (меню → «МОДУЛИ ТРУБ»). */
/* =====================================================================
   АКВА-БУМ · БИБЛИОТЕКА МОДУЛЕЙ ТРУБ — style_01 «Pixar Glass» (v0.6)
   Единый код для игры (Canvas 2D) и для набора ассетов (node-canvas).
   Модули: прямые S/M/L, угол 90°, тройник, крестовина, муфта, торец,
   заглушка, U-ловушка. Состояния: пусто/вода/кислота/лёд/пар/сюрприз.

   ===================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------- утилиты ------------------------- */
  function mulberry32(a) {

      let t = Math.imul(a ^ a >>> 15, 1 | a);

  function hashSeed(s) {
    let h = 2166136261;
    if (typeof s === 'number') h ^= s | 0;
    else { s = String(s == null ? 'p' : s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } }
    return h >>> 0;
  }
  function roundPoly(pts, r, segs) {
    segs = segs || 6;
    if (!r || pts.length < 3) return pts.slice();
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      const v1 = [p0[0] - p1[0], p0[1] - p1[1]], v2 = [p2[0] - p1[0], p2[1] - p1[1]];
      const l1 = Math.hypot(v1[0], v1[1]) || 1, l2 = Math.hypot(v2[0], v2[1]) || 1;
      const rr = Math.min(r, l1 * 0.5, l2 * 0.5);
      const a = [p1[0] + v1[0] / l1 * rr, p1[1] + v1[1] / l1 * rr];
      const b = [p1[0] + v2[0] / l2 * rr, p1[1] + v2[1] / l2 * rr];
      out.push(a);
      for (let s = 1; s <= segs; s++) {
        const tt = s / segs, mt = 1 - tt;
        out.push([mt * mt * a[0] + 2 * mt * tt * p1[0] + tt * tt * b[0],
                  mt * mt * a[1] + 2 * mt * tt * p1[1] + tt * tt * b[1]]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function polyPointAt(pts, t) { /* t in [0,1] по длине */
    let L = 0; const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
    let want = t * L;
    for (let i = 0; i < seg.length; i++) {
      if (want <= seg[i] || i === seg.length - 1) {
        const k = seg[i] ? want / seg[i] : 0;
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
      }
      want -= seg[i];
    }
    return pts[pts.length - 1];
  }
  function polyNormalAt(pts, t) {
    const a = polyPointAt(pts, Math.max(0, t - 0.02)), b = polyPointAt(pts, Math.min(1, t + 0.02));
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    return [-dy / l, dx / l];
  }
  function cutBelow(paths, y) { /* части полилиний НИЖЕ уровня y (y вниз) */
    const runs = [];
    for (const pts of paths) {
      let cur = null;
      const openRun = (p) => { cur = [p]; runs.push(cur); };
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const da = a[1] - y, db = b[1] - y;
        if (da > 0 && db > 0) { if (!cur) openRun(a); cur.push(b); }
        else if (da > 0 && db <= 0) { if (!cur) openRun(a); const k = da / (da - db); cur.push([a[0] + (b[0] - a[0]) * k, y]); cur = null; }
        else if (da <= 0 && db > 0) { const k = -da / (db - da); openRun([a[0] + (b[0] - a[0]) * k, y]); cur.push(b); }
        else cur = null;
      }
    }
    return runs.filter(r => r.length > 1);
  }
  function cutBelowLine(pts, A, B) { /* часть полилинии ниже (по знаку) прямой A→B в экранных координатах */
    const side = (p) => (B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0]);
    /* выбираем знак «погружённой» стороны по наиболее низкой точке полилинии */
    let lo = pts[0];
    for (const p of pts) if (p[1] > lo[1]) lo = p;
    const sgn = Math.sign(side(lo)) || 1;
    const runs = []; let cur = null;
    const openRun = (p) => { cur = [p]; runs.push(cur); };
    const inter = (a, b) => { const sa = side(a) * sgn, sb = side(b) * sgn; const k = sa / (sa - sb); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; };
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], da = side(a) * sgn, db = side(b) * sgn;
      if (da > 0 && db > 0) { if (!cur) openRun(a); cur.push(b); }
      else if (da > 0 && db <= 0) { if (!cur) openRun(a); cur.push(inter(a, b)); cur = null; }
      else if (da <= 0 && db > 0) { openRun(inter(a, b)); cur.push(b); }
      else cur = null;
    }
    return runs.filter(r => r.length > 1);
  }
  function bbox(pts) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    return [x0, y0, x1, y1];
  }
  function strokePoly(ctx, pts, w, style, alpha) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.globalAlpha = (alpha == null ? 1 : alpha);
    ctx.strokeStyle = style; ctx.lineWidth = Math.max(0.6, w);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke(); ctx.restore();
  }
  function offset(pts, dx, dy) { return pts.map(p => [p[0] + dx, p[1] + dy]); }
  function offsetNormal(pts, d) { /* сдвиг вдоль локальной нормали трубы */
    return pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      return [p[0] - dy / l * d, p[1] + dx / l * d];
    });
  }

  /* ------------------------- палитры ------------------------- */
  const THEMES = {
    light: {
      outline: 'rgba(146,186,214,0.92)',
      casingTop: '#F6FCFF', casingMid: '#E3F1FD', casingBot: '#C2DFF4',
      casingAlpha: 0.31,
      wall: 'rgba(255,255,255,0.36)',
      channel: 'rgba(222,242,255,0.28)',
      glossHi: 'rgba(255,255,255,0.95)', glossLo: 'rgba(255,255,255,0.40)',
      shadow: 'rgba(74,124,162,0.20)',
      rim: '#FFFFFF', rimShade: 'rgba(178,209,231,0.98)', rimInner: 'rgba(236,249,255,0.96)',
      water: { a: '#A6E2FF', b: '#2E9BF0', core: 'rgba(26,116,196,0.35)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.85)' },
      acid:  { a: '#D2FCA0', b: '#2FBF5F', core: 'rgba(22,126,62,0.35)', crest: 'rgba(248,255,230,0.95)', bubble: 'rgba(240,255,220,0.9)' },
      ice:   { a: '#FBFEFF', b: '#A8DCFB', core: 'rgba(112,178,226,0.42)', crest: 'rgba(255,255,255,1)', bubble: 'rgba(255,255,255,0.97)' },
      steam: { a: 'rgba(255,255,255,0.99)', b: 'rgba(255,219,236,0.95)', core: 'rgba(255,186,216,0.4)', crest: 'rgba(255,255,255,1)', bubble: 'rgba(255,255,255,0.95)' },
      surprise: { a: '#FFFEF8', b: '#F3E2C4', core: 'rgba(196,160,100,0.25)', mark: '#F0B23F', markInk: '#B9761F', ribbon: '#F2A63B' }
    },
    dark: {
      outline: 'rgba(126,196,232,0.55)',
      casingTop: 'rgba(240,252,255,0.42)', casingMid: 'rgba(196,231,250,0.30)', casingBot: 'rgba(150,200,232,0.22)',
      casingAlpha: 1,
      wall: 'rgba(190,230,250,0.20)',
      channel: 'rgba(14,38,56,0.28)',
      glossHi: 'rgba(255,255,255,0.50)', glossLo: 'rgba(255,255,255,0.18)',
      shadow: 'rgba(0,0,0,0.35)',
      rim: 'rgba(232,248,255,0.95)', rimShade: 'rgba(120,180,215,0.9)', rimInner: 'rgba(24,58,80,0.9)',
      water: { a: '#7ED0FF', b: '#1E7FD6', core: 'rgba(6,40,80,0.45)', crest: 'rgba(230,248,255,0.9)', bubble: 'rgba(220,245,255,0.75)' },
      acid:  { a: '#B9F288', b: '#1FA24E', core: 'rgba(6,60,30,0.45)', crest: 'rgba(240,255,224,0.9)', bubble: 'rgba(230,255,210,0.75)' },
      ice:   { a: '#EAF9FF', b: '#9FD3F5', core: 'rgba(60,120,170,0.4)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.85)' },
      steam: { a: 'rgba(255,255,255,0.85)', b: 'rgba(255,196,222,0.7)', core: 'rgba(255,170,205,0.3)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.8)' },
      surprise: { a: '#FDF7EA', b: '#E7D2AC', core: 'rgba(150,116,64,0.3)', mark: '#F0B23F', markInk: '#A8671A', ribbon: '#F2A63B' }
    }
  };

  /* ------------------------- модули (метры, Y вверх) ------------------------- */
  /* paths — полилинии осевой линии; sf — уровень жидкости (м, Y вверх)     */
  const MODULES = [
    { id: 'straightS', ru: 'Прямая S', en: 'Straight S', size: '0.5 м', sizeM: 0.5, paths: [[[0, 0], [0.5, 0]]], sf: 0.004, ports: 2 },
    { id: 'straightM', ru: 'Прямая M', en: 'Straight M', size: '1.0 м', sizeM: 1.0, paths: [[[0, 0], [1.0, 0]]], sf: 0.004, ports: 2 },
    { id: 'straightL', ru: 'Прямая L', en: 'Straight L', size: '1.5 м', sizeM: 1.5, paths: [[[0, 0], [1.5, 0]]], sf: 0.004, ports: 2 },
    { id: 'elbow', ru: 'Угол 90°', en: 'Elbow 90°', size: 'r 0.12 м', sizeM: 0.5, paths: [[[0, 0], [0.5, 0], [0.5, 0.5]]], sf: 0.0, ports: 2, rc: 0.12 },
    { id: 'tee', ru: 'Тройник', en: 'Tee', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]], [[0, 0], [0, 0.5]]], sf: 0.02, ports: 3 },
    { id: 'cross', ru: 'Крестовина', en: 'Cross', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]], [[0, -0.25], [0, 0.25]]], sf: 0.03, ports: 4 },
    { id: 'coupling', ru: 'Муфта', en: 'Coupling', size: '0.25 м', sizeM: 0.25, paths: [[[-0.25, 0], [0.25, 0]]], sf: 0.004, ports: 2, collars: [{ t: 0.5, k: 1.55 }] },
    { id: 'end', ru: 'Торец', en: 'Open end', size: '0.5 м', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]]], sf: 0.004, ports: 1, endRim: true },
    { id: 'cap', ru: 'Заглушка', en: 'Cap', size: '0.5 м', sizeM: 0.5, paths: [[[-0.5, 0], [0.1, 0]]], sf: 0.004, ports: 1, capAt: 0.1 },
    { id: 'utrap', ru: 'U-ловушка', en: 'U-trap', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0.25], [-0.25, -0.25], [0.25, -0.25], [0.25, 0.25]]], sf: 0.01, ports: 2, rc: 0.12 }
  ];
  const MOD_BY_ID = {}; MODULES.forEach(m => MOD_BY_ID[m.id] = m);

  const STATES = ['empty', 'water', 'acid', 'ice', 'steam', 'surprise'];
  const STATE_RU = { empty: 'Пусто', water: 'Вода', acid: 'Кислота', ice: 'Лёд', steam: 'Пар', surprise: 'Сюрприз' };
  const STATE_EN = { empty: 'Empty', water: 'Water', acid: 'Acid', ice: 'Ice', steam: 'Steam', surprise: 'Surprise' };
  const STATE_COL = { empty: '#8FA6B8', water: '#2E9BF0', acid: '#2FBF5F', ice: '#9FD3F5', steam: '#F1A7C4', surprise: '#E8A33D' };

  /* геометрия модуля -> экранные px (Y вниз), центр (0,0) */
  function modGeometry(id, st) {
    st = st || {};
    const m = MOD_BY_ID[id];
    const scale = st.scale || 160;              /* px на метр (длины) */
    const wOut = st.wOut || Math.max(20, scale * 0.167);
    const wIn = st.wIn || wOut * 0.76;
    const rc = (st.rc != null ? st.rc : (m.rc || 0)) * scale;
    const paths = m.paths.map(p => {
      const pp = p.map(q => [q[0] * scale, -q[1] * scale]);
      return roundPoly(pp, rc, 7);

    /* центрирование */
    const all = paths.flat();

    const cpaths = paths.map(p => offset(p, -cx, -cy));

    const surfY = -m.sf * scale - cy;

      const p = cpaths[0];
      const q = polyPointAt(p, c.t);
      extras.collars.push({ p: q, w: wOut * (c.k || 1.5) });
    }
    if (m.capAt != null) {

      const q = polyPointAt(p, 1);
      extras.cap = { p: q, dir: [1, 0] };

  }

  /* ------------------------- рендер трубы ------------------------- */
  /* o = { pts, wOut, wIn, state, runs, t, seed, dark, rims:bool, hidden:bool } */
  function drawTube(ctx, o) {
    const th = THEMES[o.dark ? 'dark' : 'light'];
    const pts = o.pts; if (!pts || pts.length < 2) return;
    const wOut = o.wOut, wIn = o.wIn == null ? wOut * 0.76 : o.wIn;
    const st = o.state || 'empty';
    const t = o.t || 0, rnd = mulberry32(hashSeed(o.seed));
    const bb = bbox(pts);

    /* Pass 2: liquids are composited after every glass wall/joint so no connector
       or crossing tube can hide the continuous stream. The narrower wIn keeps the
       outer tube contour visible. */
    if (o.liquidOnly) {
      if (st === 'steam') {
        const runs = o.runs && o.runs.length ? o.runs : [{pts}];
        for (const run of runs) drawSteamBody(ctx, run.pts || run, wIn, th, t, rnd, o);
      }
      else if (st !== 'surprise' && st !== 'empty' && o.runs && o.runs.length) {
        const col = o.color || th[st] || th.water;
        for (const run of o.runs) drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb);
      }
      return;
    }

    /* 1. тень */
    strokePoly(ctx, offset(pts, wOut * 0.06, wOut * 0.30), wOut * 1.0, th.shadow, o.dark ? 0.5 : 0.75);
    /* 2. белая граница (контур) */
    strokePoly(ctx, pts, wOut + Math.max(3, wOut * 0.15), th.outline, 0.95);
    /* 3. стеклянная оболочка */
    const cg = ctx.createLinearGradient(0, bb[1] - wOut * 0.6, 0, bb[3] + wOut * 0.6);
    if (st === 'surprise') {
      cg.addColorStop(0, th.surprise.a); cg.addColorStop(1, th.surprise.b);
      strokePoly(ctx, pts, wOut, cg, 1);
    } else {
      cg.addColorStop(0, th.casingTop); cg.addColorStop(0.42, th.casingMid); cg.addColorStop(1, th.casingBot);
      strokePoly(ctx, pts, wOut, cg, th.casingAlpha);
    }
    /* 4. канал */
    if (st === 'surprise') {
      const sg = ctx.createLinearGradient(0, bb[1], 0, bb[3]);
      sg.addColorStop(0, '#FFFDF6'); sg.addColorStop(1, '#EFD9B4');
      strokePoly(ctx, pts, wIn, sg, 1);
    } else {
      strokePoly(ctx, pts, (wIn + wOut) / 2, th.wall, 0.9);
      strokePoly(ctx, pts, wIn, th.channel, 0.9);
    }

    /* 5. содержимое (в игровом кадре приходит отдельным верхним проходом) */
    if (!o.skipLiquid) {
      if (st === 'steam') {
        const runs = o.runs && o.runs.length ? o.runs : [{pts}];
        for (const run of runs) drawSteamBody(ctx, run.pts || run, wIn, th, t, rnd, o);
      }
      else if (st !== 'surprise' && st !== 'empty' && o.runs && o.runs.length) {
        const col = o.color || th[st] || th.water;
        for (const run of o.runs) drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb);
      }
    }

    /* 6. блики стекла — по нормали, чтобы не закрывать жидкость вертикальных труб */
    strokePoly(ctx, offsetNormal(pts, -wOut * 0.27), wOut * 0.20, th.glossHi, 0.9);
    strokePoly(ctx, offsetNormal(pts, -wOut * 0.05), wOut * 0.07, th.glossLo, 0.85);
    strokePoly(ctx, offsetNormal(pts, wOut * 0.24), wOut * 0.10, th.glossLo, 0.55);

    /* 7. сюрприз: «?» и бант (поверх непрозрачного корпуса) */
    if (st === 'surprise') {
      const c = polyPointAt(pts, 0.5), n = polyNormalAt(pts, 0.5);
      const r = wOut * 0.40;
      ctx.save();
      ctx.fillStyle = '#E39A2B'; ctx.beginPath(); ctx.arc(c[0], c[1], r * 1.14, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF6DE'; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = Math.max(1.6, wOut * 0.055); ctx.stroke();
      ctx.fillStyle = '#B9761F'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + (r * 1.7).toFixed(1) + 'px sans-serif';
      ctx.fillText('?', c[0], c[1] + r * 0.10);
      ctx.restore();
      /* бант */
      ctx.save();
      const q = polyPointAt(pts, 0.5);
      ctx.translate(q[0] + n[0] * wOut * 0.55, q[1] + n[1] * wOut * 0.55);
      ctx.fillStyle = th.surprise.ribbon;
      ctx.beginPath(); ctx.ellipse(-r * 0.36, 0, r * 0.34, r * 0.20, -0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.36, 0, r * 0.34, r * 0.20, 0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, 7); ctx.fill();
      ctx.restore();
    }

    /* 8. торцевые кольца-муфты (true/false или [голова, хвост]) */
    const rims = o.rims === false ? [false, false] : (Array.isArray(o.rims) ? o.rims : [true, true]);
    if (rims[0]) collar(ctx, pts[0], angleAt(pts, 0), wOut, th);
    if (rims[1]) collar(ctx, pts[pts.length - 1], angleAt(pts, 1), wOut, th);
    /* доп. муфты */
    if (o.collars) for (const c of o.collars) collar(ctx, c.p, c.ang || 0, c.w || wOut, th);
  }

  function angleAt(pts, t) {
    const a = polyPointAt(pts, Math.max(0, t - 0.03)), b = polyPointAt(pts, Math.min(1, t + 0.03));
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  }

  function collar(ctx, p, ang, wOut, th, k) {
    /* Прозрачная кромка стыка: только две стеклянные обводки, без заливки канала. */
    k = k || 1;
    ctx.save();
    ctx.translate(p[0], p[1]); ctx.rotate(ang);
    const rx = wOut * 0.21 * k, ry = wOut * (0.63 + 0.08 * (k - 1));
    ctx.lineWidth = Math.max(1.1, wOut * 0.055);
    ctx.strokeStyle = th.rimShade;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(0.8, wOut * 0.028);
    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.72, ry * 0.78, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb) {
    const pts = run.pts || run;
    if (!pts || pts.length < 2) return;
    const lg = ctx.createLinearGradient(0, bb[1], 0, bb[3] + wIn * 0.6);
    lg.addColorStop(0, col.a); lg.addColorStop(1, col.b);
    const iceFill = st === 'ice';
    strokePoly(ctx, pts, wIn * 0.96, lg, iceFill ? 1 : 0.96);
    strokePoly(ctx, pts, wIn * 0.52, col.core, iceFill ? 0.9 : 0.8);
    if (iceFill) {
      /* морозная шапка вдоль верха сегмента */
      strokePoly(ctx, offset(pts, 0, -wIn * 0.24), wIn * 0.30, 'rgba(255,255,255,0.92)', 0.95);
      strokePoly(ctx, offset(pts, 0, -wIn * 0.22), wIn * 0.10, 'rgba(214,240,255,0.95)', 0.9);
    }
    /* поверхность: волна + гребень */
    const surfaces = run.surfs || (run.surf != null ? [run.surf] : []);
    for (const surfaceT of surfaces) {
      const sp = polyPointAt(pts, surfaceT);
      const n = polyNormalAt(pts, surfaceT);
      const width = wIn * 0.86;
      ctx.save();
      ctx.strokeStyle = col.crest; ctx.lineWidth = Math.max(1.4, wIn * 0.10); ctx.lineCap = 'round';
      ctx.beginPath();
      const px = -n[1], py = n[0];
      const stableFluid = st === 'water' || st === 'acid' || st === 'ice';
      const ph = stableFluid ? 0 : (t * 2.2 + (run.ph || 0) + surfaceT * 4);
      for (let i = 0; i <= 12; i++) {
        const u = i / 12 - 0.5;
        const wob = stableFluid ? 0 : (Math.sin(u * 6.0 + ph) * wIn * 0.07 + Math.sin(u * 11.0 - ph * 1.4) * wIn * 0.03);
        const X = sp[0] + px * u * width + n[0] * wob, Y = sp[1] + py * u * width + n[1] * wob;
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke(); ctx.restore();
      const cg = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], wIn * 0.75);
      cg.addColorStop(0, 'rgba(255,255,255,0.45)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], wIn * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    /* Water and acid use stable, clean fills; no continuously bobbing bubble layer. */
    const nb = (st === 'water' || st === 'acid' || st === 'ice') ? 0 : Math.max(2, Math.round(pts.length * 0.55));
    for (let i = 0; i < nb; i++) {
      const u = 0.06 + rnd() * 0.88;
      const cnt = polyPointAt(pts, u), nrm = polyNormalAt(pts, u);
      const off = (rnd() - 0.5) * wIn * 0.55;
      const bob = Math.sin(t * 1.7 + rnd() * 6.28) * wIn * 0.10;
      const r = Math.min(wIn * (0.06 + rnd() * 0.09), 9);
      const X = cnt[0] + nrm[0] * (off + bob), Y = cnt[1] + nrm[1] * (off + bob);
      ctx.save();
      ctx.fillStyle = col.bubble; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.95; ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = Math.max(0.8, r * 0.28);
      ctx.beginPath(); ctx.arc(X, Y, r * 0.72, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
      ctx.restore();
    }
    /* Ice markings are fixed in space: no random crystals, particles, or shimmer. */
    if (st === 'ice') {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.88)'; ctx.lineWidth = Math.max(1.1, wIn * 0.055);
      const n = Math.max(5, Math.round(pts.length * 1.2));
      for (let i = 0; i < n; i++) {
        const u = 0.08 + (i + 0.5) / n * 0.84;
        const c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
        const half = Math.min(wIn * (0.17 + (i % 3) * 0.035), 13), a = (i % 2 ? 0.72 : -0.58);
        ctx.globalAlpha = 0.58 + (i % 3) * 0.10;
        ctx.beginPath();
        ctx.moveTo(c[0] - Math.cos(a) * half, c[1] - Math.sin(a) * half);
        ctx.lineTo(c[0] + Math.cos(a) * half, c[1] + Math.sin(a) * half);
        ctx.stroke();
        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.74)';
          ctx.beginPath(); ctx.arc(c[0] + nm[0] * wIn * 0.20, c[1] + nm[1] * wIn * 0.20, Math.min(wIn * 0.035, 2.5), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }
  }

  function drawSteamBody(ctx, pts, wIn, th, t, rnd, o) {
    const col = th.steam;
    /* лёгкая дымка внутри */
    strokePoly(ctx, pts, wIn * 0.9, 'rgba(255,231,243,0.75)', 0.85);
    strokePoly(ctx, pts, wIn * 0.95, col.b, 0.55);
    const n = Math.max(6, Math.round(pts.length * 1.2));
    for (let i = 0; i < n; i++) {
      const u = (i + rnd() * 0.4) / n;
      const c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
      const off = (rnd() - 0.5) * wIn * 0.4;
      const r = Math.min(wIn * (0.30 + rnd() * 0.26), 26);
      const drift = Math.sin(t * 0.9 + rnd() * 6.28) * wIn * 0.12;
      const X = c[0] + nm[0] * (off + drift), Y = c[1] + nm[1] * (off + drift);
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, r * 1.6);
      g.addColorStop(0, col.a); g.addColorStop(0.55, 'rgba(255,240,248,0.75)'); g.addColorStop(1, 'rgba(255,240,248,0)');
      ctx.save(); ctx.globalAlpha = 0.9; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(X, Y, r * 1.6, 0, 7); ctx.fill(); ctx.restore();
    }
    /* капельки */
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 3; i++) {
      const u = 0.15 + rnd() * 0.7, c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
      ctx.globalAlpha = 0.5 + 0.4 * Math.sin(t * 2 + i);
      ctx.beginPath(); ctx.arc(c[0] + nm[0] * wIn * 0.25, c[1] + nm[1] * wIn * 0.25, wIn * 0.05, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  /* ------------------------- модуль целиком ------------------------- */
  /* рисует модуль в точке (x,y) — центр; opts: {state, scale, t, dark, seed, alpha, wOut} */
  function drawModule(ctx, id, x, y, opts) {
    opts = opts || {};
    const geo = modGeometry(id, opts);
    const st = opts.state || 'empty';
    ctx.save();
    ctx.translate(x, y);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    const pathRuns = geo.paths.map((p,pi) => (st === 'empty' || st === 'steam' || st === 'surprise') ? [] :
      cutBelow([p], geo.surfY).map((r, i) => ({ pts: r, surf: surfaceIdx(r), ph: pi * 1.7 + i * 0.9 })));
    // Draw all glass branches first, then the liquid pass across tees/crosses.
    geo.paths.forEach((p, pi) => drawTube(ctx, {
      pts: p, wOut: geo.wOut, wIn: geo.wIn, state: st, runs: pathRuns[pi],
      t: opts.t || 0, seed: (opts.seed || id) + st + pi, dark: opts.dark,
      rims: opts.rims !== false, collars: [], skipLiquid: true
    }));
    geo.paths.forEach((p, pi) => drawTube(ctx, {
      pts: p, wOut: geo.wOut, wIn: geo.wIn, state: st, runs: pathRuns[pi],
      t: opts.t || 0, seed: (opts.seed || id) + st + pi, dark: opts.dark, liquidOnly: true
    }));
    /* муфты */
    for (const c of (geo.extras.collars || [])) collar(ctx, c.p, angleAt(geo.paths[0], c.t || 0.5), c.w, THEMES[opts.dark ? 'dark' : 'light'], 1);
    /* заглушка-домик */
    if (geo.extras.cap) {
      const th = THEMES[opts.dark ? 'dark' : 'light'];
      const p = geo.extras.cap.p, w = geo.wOut;
      const g = ctx.createLinearGradient(p[0] - w, p[1] - w / 2, p[0] + w, p[1] + w / 2);
      g.addColorStop(0, th.casingTop); g.addColorStop(1, th.casingBot);
      ctx.save();
      ctx.beginPath(); ctx.arc(p[0], p[1], w * 0.52, -Math.PI / 2, Math.PI / 2); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = th.outline; ctx.lineWidth = Math.max(2, w * 0.10); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(p[0] + w * 0.16, p[1], w * 0.16, w * 0.34, 0, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function surfaceIdx(runPts) {
    let idx = 0, best = 1e9;
    for (let i = 0; i < runPts.length; i++) if (runPts[i][1] < best) { best = runPts[i][1]; idx = i; }
    return runPts.length > 1 ? idx / (runPts.length - 1) : 0;
  }

  /* прокси для демо: набор модулей уровня */
  const LEVEL_MODULES = {
    S: ['tank'], A1: ['straightS'], J: ['coupling'], B1: ['straightM', 'elbow'],
    UL: ['straightS'], UM: ['straightM'], UR: ['straightS'],
    C1: ['straightM', 'elbow'], F: ['end'], AC: ['tank'], AL: ['straightM', 'elbow', 'straightM']
  };

  return {
    THEMES, MODULES, MOD_BY_ID, STATES, STATE_RU, STATE_EN, STATE_COL,
    modGeometry, drawTube, drawModule, cutBelow, cutBelowLine, roundPoly, strokePoly, offsetNormal,
    polyPointAt, polyNormalAt, hashSeed, mulberry32, LEVEL_MODULES
  };
});

  help_html:`<h3>МОДУЛИ И КОНСТРУКТОР (v0.6)</h3><p>Стеклянные трубы и соединители прозрачны. В <b>КОНСТРУКТОРЕ</b> выбери прямую, угол, тройник или U-модуль: коснись трубы для точного стыка либо свободного места, чтобы протянуть новое ответвление к стенду. Ползунок задаёт угол от 0° до 359°; выбери добавленную деталь для поворота, удали её кнопкой X или двойным тапом. Добавляй камеры воды и кислоты без ограничений; на уровне остаются только одна стартовая батисфера и одна камера выхода. Кнопки «Вода», «Кислота» и «Пусто» меняют содержимое труб, а также можно поставить 3D-шибер, охладитель или нагреватель.</p><h3>ЦЕЛЬ И УПРАВЛЕНИЕ</h3><p>Проведи Уму в капсуле-шарике из стартовой батисферы в камеру спасения. Потяни стенд мышью или пальцем, чтобы свободно повернуть всю конструкцию по трём осям; лаборатория остаётся вертикальной. Колесо, щипок и кнопки − / + управляют умеренным зумом.</p><h3>3D-ШИБЕР И ТЕПЛОВЫЕ МОДУЛИ</h3><ul><li>Квадратный шибер — трёхмерная деталь трубопровода с прозрачным корпусом, видимой заслонкой и приводом. Он вращается вместе с трубами и действительно перекрывает поток.</li><li>В конструкторе выбери шибер и коснись трубы для установки. Во время игры коснись корпуса, чтобы открыть или закрыть его.</li><li>Синяя боковая кнопка охладителя и красная кнопка нагревателя включают постепенное изменение температуры прилегающих участков. Нажми снова, чтобы выключить.</li><li>Стрелки/WASD — вращение; Q/E — крен; +/− — зум; F/Space — заморозить воду в модуле B; лёд тает только выше 0°C; R — рестарт; 1/2 — шиберы A/C; Esc — пауза.</li></ul><h3>ФАЗЫ И КИСЛОТА</h3><p><span class="chip w">ВОДА</span>замерзает при 0°C и ниже; лёд тает выше 0°C; при 100°C вода кипит, а пар конденсируется ниже 100°C. Пар поднимается по открытой трубе. <span class="chip a">КИСЛОТА</span>остаётся жидкой при любой температуре: не замерзает и не превращается в пар. Холодная кислота темнее и течёт медленнее, горячая светлее и быстрее.</p><p>В меню <b>МОИ УРОВНИ</b> задай имя и сохрани  hitZones.push({x:s[0],y:s[1],r:Math.max(26,px*0.2),kind:'freeze',node:n});

function arcVec(x,y){

 let nx=(x-r.left-r.width/2)/scale,ny=-(y-r.top-r.height/2)/scale,l=Math.hypot(nx,ny);

function applyArcball(v0,v1,dt){

function nearestPipePlacement(x,y,force=false,avoidOccupied=false){
 let best=null;
 for(const base of runtimeBaseNodes()){
  if(base.tank||base.freeze)continue;
  const m=pathMetrics(base.pts);if(m.L<GATE_END_MARGIN*2+0.025)continue;
  for(let i=1;i<base.pts.length;i++){
   const segLen=m.len[i-1];if(segLen<1e-8)continue;
   const s0=m.cum[i-1],s1=m.cum[i];
   const minS=Math.max(GATE_END_MARGIN,s0),maxS=Math.min(m.L-GATE_END_MARGIN,s1);
   if(maxS-minS<0.025)continue;
   const a=base.pts[i-1],b=base.pts[i],tlo=(minS-s0)/segLen,thi=(maxS-s0)/segLen;
   const screenAt=u=>{
    const p=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];
    const q=proj(worldPoint(p));return {p,q,d2:(q[0]-x)**2+(q[1]-y)**2};
   };
   let lo=tlo,hi=thi;
   for(let k=0;k<17;k++){
    const t1=lo+(hi-lo)/3,t2=hi-(hi-lo)/3;
    if(screenAt(t1).d2<screenAt(t2).d2)hi=t2;else lo=t1;
   }
   const choices=[tlo,thi,(lo+hi)/2];let bestSeg=null;
   for(const u of choices){const q=screenAt(u);if(q.q[2]<=0.1)continue;
    if(!bestSeg||q.d2<bestSeg.d2)bestSeg={...q,u};}
   if(!bestSeg)continue;
   const globalS=s0+bestSeg.u*segLen,ppm=ppmAt(bestSeg.q[2]);
   const radius=Math.max(21,ppm*PIPE_R*2*.94);
   if(!force&&bestSeg.d2>radius*radius)continue;
   if(avoidOccupied&&gateSpotOccupied(bestSeg.p))continue;
   const candidate={nodeId:base.id,s:globalS,p:bestSeg.p,tangent:pathTangentAt(base.pts,m.cum,globalS),
    x:bestSeg.q[0],y:bestSeg.q[1],depth:bestSeg.q[2],distance:Math.sqrt(bestSeg.d2)};
   if(!best||candidate.distance<best.distance-0.25||
     (Math.abs(candidate.distance-best.distance)<=0.25&&candidate.depth<best.depth))best=candidate;
  }
 }
 return best;
}
function gateSpotOccupied(p){

 for(const e of ED)if((e.valve||e.deviceType)&&e.vpos)pos.push(e.vpos);
 return pos.some(q=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])<GATE_MIN_SPACING);
}

function rebuildCustomPipePart(part){

/* ================= главный цикл ====================================== */
let lastT=0,acc=0,statT=0,dtFrame=1/60;
function frame(ts){
 requestAnimationFrame(frame);
 const t=ts/1000;
 let dt=Math.min(0.05,t-lastT||0.016);lastT=t;
 dtFrame=dt;fps=1/dt;fpsE+= (fps-fpsE)*0.06;
 if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.display='none';}
 if(gameScreen()&&!paused){
  if(W<4||H<4)resize();
  /* инерция arcball: как внешний поворот сферы, без ограничений по углу */
  if(!drag&&rot.speed>1e-4){
   rot.q=qNormalize(qMultiply(qAxisAngle(rot.axis,rot.speed*dt),rot.q));
   rot.speed*=Math.exp(-ROT_DAMP*Math.min(.25,dt));if(rot.speed<.015)rot.speed=0;
  }
  labYaw=qYaw(rot.q);
  acc+=dt;let n=0;
  while(acc>=1/SIM_HZ&&n<4){simStep(1/SIM_HZ);acc-=1/SIM_HZ;n++;}
  if(acc>0.2)acc=0;
  hitZones.length=0;
  render(t);
  updateHint(dt);
  /* кольцо заморозки */
  const fr=document.getElementById('freezeArc');
  fr.setAttribute('stroke-dashoffset',(62.8*(1-freezeLeft/FREEZE_TIME)).toFixed(1));
  document.getElementById('btn-freeze').classList.toggle('hot',freezeOn);
  statT+=dt;if(statT>0.25){statT=0;paintStats();}
 } else {
  hitZones.length=0;
 }
}

let modsState='water',modsBuilt=false;
function renderMods(){
 const $=id=>document.getElementById(id);
 const dark=document.documentElement.dataset.theme==='dark';
 if(!modsBuilt){
  const bar=$('mods-bar');
  PLIB.STATES.forEach(st=>{
   const b=document.createElement('button');b.type='button';b.dataset.st=st;
   b.innerHTML='<span class="dot" style="background:'+PLIB.STATE_COL[st]+'"></span>'+(LANG==='ru'?PLIB.STATE_RU[st]:PLIB.STATE_EN[st]);
   b.addEventListener('click',()=>{S.click();modsState=st;renderMods();});
   bar.appendChild(b);
  });
  const grid=$('mods-grid');
  PLIB.MODULES.forEach(m=>{
   const cell=document.createElement('div');cell.className='mod-cell';
   const cv2=document.createElement('canvas');cv2.width=460;cv2.height=250;
   cell.appendChild(cv2);
   const nm=document.createElement('div');nm.className='mname';nm.textContent=m.ru+' · '+m.size;
   const mm=document.createElement('div');mm.className='mmeta';mm.textContent=(m.en||m.id)+' · '+(LANG==='ru'?'портов':'ports')+': '+m.ports;
   cell.appendChild(nm);cell.appendChild(mm);
   cell._cv=cv2;cell._m=m;
   grid.appendChild(cell);
  });
  modsBuilt=true;
 }
[...$('mods-bar').children].forEach(b=>b.classList.toggle('on',b.dataset.st===modsState));
[...$('mods-grid').children].forEach(cell=>{
  const g2=cell._cv.getContext('2d');
  g2.clearRect(0,0,cell._cv.width,cell._cv.height);
  let sc=190,wOut=46,wIn=35;
  let geo=PLIB.modGeometry(cell._m.id,{scale:sc,wOut:wOut,wIn:wIn});
  const k=Math.min(1,(cell._cv.width-60)/(geo.bb[2]-geo.bb[0]),(cell._cv.height-40)/(geo.bb[3]-geo.bb[1]));
  sc*=k;wOut*=k;wIn*=k;
  PLIB.drawModule(g2,cell._m.id,cell._cv.width/2,cell._cv.height/2,
   {state:modsState,scale:sc,wOut:wOut,wIn:wIn,t:performance.now()/1000,dark:dark,seed:cell._m.id});
 });
}

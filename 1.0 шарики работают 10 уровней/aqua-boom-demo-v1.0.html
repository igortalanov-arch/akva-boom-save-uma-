<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" name="viewport"/>
<meta content="#dfe9f2" name="theme-color"/>
<meta content="dark light" name="color-scheme"/>
<meta content="Головоломка «Аква-Бум: Спасти Уму»: вращай стенд из прозрачных труб, управляй водой, льдом, кислотой, паром, щёлочью и шиберами. 10 уровней, звёзды и чипы памяти. Спаси Уму!" name="description"/>
<meta content="yes" name="mobile-web-app-capable"/>
<title>Аква-Бум! Спасти Уму — v1.0</title>
<!--
  АКВА-БУМ! СПАСТИ УМУ · v1.0 (полная игра, 10 уровней)
  Построено на техно-демо v0.14 (шариковая модель: PBD-контакты, дымка, шиберы,
  охладитель/нагреватель, камеры-пулы, кислота, лёд, пар, Ума-шарик).
  Новое в v1.0:
   - 10 уровней кампании с мета-прогрессией: звёзды (пройти / без потерь / на время),
     чипы памяти (1 за уровень), «Звёздный ключ» и финальный экран.
   - 4 новых типа шариков: щёлочь (нейтрализует кислоту), сюрприз (бонусы Уме),
     магнитный (притягивается к магниту), пузырь (несёт Уму вверх, лопается через 3 с).
   - 8 новых устройств/ловушек: фильтр, турникет, вентилятор, дозатор, магнит,
     телепорт, весы, таймер (+ давилка, тупик как типы узлов).
   - Пар: тепловая инерция (конденсируется не мгновенно), пассивный дрейф температуры
     к +20°C — лёд тает, если охладитель выключить.
   - Подсказки по бездействию с таймингом на уровень, стрелка над нужным шибером.
   - Деградация качества при низком FPS, локализация RU/EN всех строк.
  Один файл, без внешних зависимостей. Canvas 2D + собственная 3D-математика.
  Платформы: Яндекс Игры / VK Mini Apps / Web (правила те же, что в v0.12:
   звук стоп при потере фокуса, пауза по visibilitychange, тап-цели >= 44px,
   нет внешних URL, прогресс в localStorage, имена файлов — латиница без пробелов).
-->
<style>
/* ============ АКВА-БУМ: styles, dark+light themes, responsive ============ */
:root{
  --aqua:#28c4e8; --aqua2:#0e9cc4; --emerald:#3ddc84; --coral:#ff6a6a; --acid:#54e06a;
  --ink:#173042; --mut:#5b7386;
  --panel:rgba(255,255,255,.78); --panel-b:rgba(20,120,150,.28);
  --bg1:#e8f2f8; --bg2:#d7e6f0; --bg3:#c3d7e4;
  --card:linear-gradient(#ffffff,#eef7fb); --card-b:rgba(20,120,150,.45);
  --btnbg:rgba(255,255,255,.88); --btnb:rgba(14,120,150,.45);
  --hint:#1d4b60; --hint2:#0c7a4d; --dim:#6d8496;
  --shadow:0 6px 18px rgba(20,60,80,.18);
}
[data-theme="dark"]{
  --ink:#e6f4fa; --mut:#8fb3c4;
  --panel:rgba(10,26,38,.72); --panel-b:rgba(40,196,232,.30);
  --bg1:#081720; --bg2:#05101a; --bg3:#030a10;
  --card:linear-gradient(#10283a,#081724); --card-b:rgba(40,196,232,.5);
  --btnbg:rgba(12,34,48,.85); --btnb:rgba(40,196,232,.45);
  --hint:#bfe6f2; --hint2:#7df0b0; --dim:#6f93a5;
  --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:none;
  background:linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column}
button{font-family:inherit;color:var(--ink);background:var(--btnbg);border:1px solid var(--btnb);
  border-radius:12px;min-height:48px;min-width:48px;padding:8px 14px;font-size:15px;font-weight:600;
  cursor:pointer;box-shadow:var(--shadow);transition:filter .15s,transform .12s}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(160deg,var(--aqua),var(--aqua2));color:#04222e;border-color:rgba(255,255,255,.5);font-size:18px}
button.ghost{background:var(--panel);border-color:var(--panel-b)}
button.small{min-height:48px;min-width:48px;padding:6px 9px;font-size:13px;border-radius:10px}
@media (hover:hover){button:hover{filter:brightness(1.08)}}
/* ---------- chrome (top bar on every screen) ---------- */
:root{--chrome-h:50px}
#chrome{display:flex;justify-content:center;align-items:center;gap:8px;padding:4px 10px 2px;z-index:7;height:var(--chrome-h);flex:0 0 auto}
.chrome-c{display:flex;gap:8px;align-items:center}
#btn-back{min-width:48px;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.ico-btn{min-width:48px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ico{width:22px;height:22px;vertical-align:middle;pointer-events:none}
.ico-btn.off img.ico{opacity:.4}
.mute-slash{display:none;position:absolute;left:11px;top:50%;width:22px;height:3px;background:var(--coral);
  transform:rotate(-45deg);border-radius:2px;pointer-events:none}
.ico-btn.off .mute-slash{display:block}
#lang-lbl{font-weight:800;letter-spacing:.5px}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:5}
.screen.on{display:flex}
.screen-scroll{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.logo{font-size:clamp(34px,9vw,64px);font-weight:900;letter-spacing:2px;text-align:center;
  color:var(--aqua2);text-shadow:0 2px 0 #fff,0 4px 14px rgba(20,160,200,.35)}
[data-theme="dark"] .logo{color:var(--aqua);text-shadow:0 0 18px rgba(40,196,232,.55),0 2px 3px #000}
.h1sub{font-size:clamp(15px,2.4vw + 8px,26px);letter-spacing:5px;color:var(--hint);font-weight:700;text-align:center}
.menu-actions{display:flex;flex-direction:column;gap:10px;width:min(86vw,340px);margin-top:8px}
.menu-actions button{width:100%}
.ver{font-size:11px;color:var(--dim);margin-top:10px;text-align:center}
.scr-title{font-size:clamp(20px,4vw,30px);letter-spacing:2px;text-align:center;color:var(--hint);margin:14px 8px 6px}
.sub{color:var(--mut);font-size:14px;text-align:center;padding:0 14px}
.helpbox{max-width:620px;margin:6px auto 26px;background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.helpbox h3{font-size:15px;letter-spacing:1px;color:var(--aqua2);margin:10px 0 6px}
[data-theme="dark"] .helpbox h3{color:var(--aqua)}
.helpbox p,.helpbox li{font-size:14px;line-height:1.5;color:var(--ink)}
.helpbox ul{padding-left:20px}
.chip{display:inline-block;padding:1px 8px;border-radius:8px;font-weight:700;font-size:12px;margin-right:6px}
.chip.w{background:rgba(40,140,255,.18);color:#1668c8}
.chip.a{background:rgba(84,224,106,.2);color:#1d9436}
.chip.i{background:rgba(160,220,255,.25);color:#2a7fa8}
[data-theme="dark"] .chip.w{color:#7cc4ff}
[data-theme="dark"] .chip.a{color:#8df09c}
[data-theme="dark"] .chip.i{color:#bfe8ff}
/* ---------- game screen ---------- */
#scr-game{position:fixed;inset:0;display:none;z-index:4;flex-direction:column}
#scr-game.on{display:flex}
#stage{position:absolute;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.grabbing{cursor:grabbing}
#hud-top{position:absolute;top:calc(var(--chrome-h) + 8px);left:10px;right:auto;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:6;pointer-events:none}
#hud-top button{pointer-events:auto}
.hud-action{width:56px;height:56px;min-width:56px;min-height:56px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:14px}
.hud-symbol{font-size:24px;line-height:25px}.hud-caption{font-size:8px;line-height:11px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
#btn-freeze{border-color:rgba(90,190,255,.6)}
#btn-freeze .fl{font-size:8px;letter-spacing:.2px;font-weight:800}
#freezeRing{width:26px;height:26px}
#btn-freeze.hot{border-color:var(--aqua);box-shadow:0 0 14px rgba(40,196,232,.55)}
#btn-freeze:disabled{opacity:.55}
#freezeRing{width:26px;height:26px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));
  z-index:6;pointer-events:none;max-width:92vw;text-align:center}
#hint1{font-size:clamp(14px,2.6vw,18px);font-weight:700;color:var(--hint);background:var(--panel);
  border:1px solid var(--panel-b);border-radius:14px;padding:8px 16px;box-shadow:var(--shadow);display:inline-block}
#hint1.terr{color:var(--coral)}
#dragHint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(108px + env(safe-area-inset-bottom,0px));
  font-size:11px;color:var(--dim);z-index:5;pointer-events:none;text-align:center;max-width:90vw;
  background:var(--panel);border-radius:10px;padding:3px 10px;opacity:.9}
#ctrl{position:absolute;left:auto;right:12px;top:50%;bottom:auto;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:6}
#ctrl button{width:52px;height:52px;min-width:52px;min-height:52px;padding:4px;font-size:24px;border-radius:14px}
#ctrl button.rot:active{background:var(--aqua)}
#bGate{font-size:19px;font-weight:900;line-height:1}
#bGate.placing{background:linear-gradient(160deg,#ffb17a,#ff7168);color:#421811;border-color:#fff;box-shadow:0 0 15px rgba(255,113,104,.58)}
#stats{position:absolute;top:calc(var(--chrome-h) + 8px);right:76px;z-index:6;font-size:10px;line-height:1.45;
  color:var(--dim);background:var(--panel);border:1px solid var(--panel-b);border-radius:10px;padding:5px 8px;
  pointer-events:auto;cursor:pointer;white-space:pre;font-family:Consolas,monospace}
#toast{position:fixed;left:50%;top:auto;bottom:22%;transform:translateX(-50%);z-index:60;display:none;
  background:var(--panel);border:1px solid var(--card-b);border-radius:16px;padding:12px 22px;
  font-size:16px;font-weight:700;color:var(--hint);box-shadow:var(--shadow);text-align:center}
/* ---------- v0.12 adaptive constructor drawer ---------- */
#constructorPanel{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--panel-b);box-shadow:var(--shadow);backdrop-filter:blur(8px);touch-action:auto;overflow:hidden}
#constructorPanel[hidden]{display:none}
#constructorPanel .ctor-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--hint);font-size:13px;min-height:48px;touch-action:none}
#ctor-collapse,#ctor-collapse-mini{width:48px;height:48px;min-width:48px;min-height:48px;padding:4px;font-size:20px;flex:none}
.ctor-tools-row{display:flex;align-items:center;min-width:0;gap:6px}
.ctor-tool-scroll{min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;touch-action:pan-x;flex:1}
.ctor-grid{display:flex;gap:8px;width:max-content}
.ctor-grid button{width:56px;height:52px;min-width:56px;min-height:52px;padding:3px;font-size:9px;line-height:1.05;border-radius:11px;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool-ico{font-size:19px;line-height:22px}.tool-lbl{font-size:8px;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctor-grid button.selected,.ctor-modules button.selected{outline:2px solid var(--aqua2);background:rgba(40,196,232,.28)}
.ctor-grid button[data-ctor-tool="cooler"]{border-color:#3b9cff}.ctor-grid button[data-ctor-tool="heater"]{border-color:#ff6b55}
#ctor-collapse-mini{display:none}
.ctor-advanced{padding:8px 2px 2px;overflow:auto;max-height:calc(42vh - 58px);touch-action:pan-y}
.ctor-advanced[hidden]{display:none}
#ctor-hint{font-size:11px;line-height:1.3;color:var(--mut);padding:1px 0 5px}
.ctor-modules{display:flex;gap:8px;margin-top:5px;overflow-x:auto}
.ctor-modules[hidden]{display:none}
.ctor-modules button{flex:1;min-width:58px;min-height:48px;font-size:10px;padding:4px;box-shadow:none}
.ctor-angle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:7px}
.ctor-angle-grid label{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px;font-size:10px;color:var(--mut)}
.ctor-angle-grid input{grid-column:1/-1;width:100%;height:48px;min-height:48px;accent-color:var(--aqua2);touch-action:auto}
.ctor-angle-grid output{font-size:10px;color:var(--hint)}
.ctor-presets{display:flex;gap:8px;margin-top:6px;overflow-x:auto}
.ctor-presets button{min-width:48px;min-height:48px;padding:3px;font-size:11px;box-shadow:none}
.ctor-options{display:flex;gap:8px;margin-top:7px}.ctor-options button{flex:1;min-height:48px;font-size:11px;box-shadow:none}
.ctor-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.ctor-actions button{min-height:48px;padding:5px 8px;font-size:11px;box-shadow:none}
#ctor-selected{font-size:10px;color:var(--hint);min-height:14px;margin-top:4px}
#ctor-delete{color:#a52d32;border-color:rgba(220,70,70,.55)}
#scr-game.constructor-mode #btn-freeze,#scr-game.constructor-mode #btn-restart,#scr-game.constructor-mode #hint,#scr-game.constructor-mode #dragHint,#scr-game.constructor-mode #bGate{display:none!important}
#scr-game.constructor-mode #ctrl{top:calc(var(--chrome-h) + 10px);transform:none}
#scr-game.constructor-mode #stats{display:none!important}
#contextMenu{position:absolute;z-index:15;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:min(250px,78vw);padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--panel-b);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
#contextMenu[hidden]{display:none}#contextMenu button{min-height:48px;font-size:11px;padding:5px}
@media(orientation:portrait){#constructorPanel{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:42vh;border-radius:18px;padding:5px 6px 7px}
 #constructorPanel.collapsed{height:56px;max-height:56px;padding:1px 6px}.ctor-topline{display:none!important}.ctor-tools-row{height:52px;padding-right:50px}#ctor-collapse-mini{display:block;position:absolute;right:5px;top:4px}
 #constructorPanel:not(.collapsed) #ctor-collapse-mini{display:none}#constructorPanel:not(.collapsed) .ctor-topline{display:flex!important}
 #constructorPanel:not(.collapsed) .ctor-advanced{max-height:calc(42vh - 112px)}
 #constructorPanel.collapsed .ctor-advanced{display:none!important}
}
@media(orientation:landscape){#constructorPanel{left:8px;top:calc(var(--chrome-h) + 8px);bottom:10px;width:min(330px,34vw);max-height:none;border-radius:16px;padding:8px}
 #constructorPanel.collapsed{width:64px;height:auto;max-height:none}.ctor-topline{display:flex}#constructorPanel.collapsed .ctor-topline{display:none}
 .ctor-tools-row{align-items:flex-start}.ctor-tool-scroll{overflow-y:auto;max-height:38vh}.ctor-grid{flex-wrap:wrap;width:auto;justify-content:flex-start}.ctor-grid button{width:54px;min-width:54px}
 #ctor-collapse-mini{display:none}#constructorPanel.collapsed #ctor-collapse-mini{display:block;position:absolute;left:7px;top:6px;z-index:3}
 #constructorPanel.collapsed .ctor-tools-row{padding-top:54px;flex-direction:column;height:100%;overflow:auto}#constructorPanel.collapsed .ctor-tool-scroll{overflow:visible;max-height:none}
 #constructorPanel.collapsed .ctor-grid{flex-direction:column;flex-wrap:nowrap;align-items:center}#constructorPanel.collapsed .tool-lbl{display:none}#constructorPanel.collapsed .ctor-grid button{width:52px;min-width:52px;height:52px;min-height:52px}
 #constructorPanel.collapsed .ctor-advanced{display:none!important}.ctor-advanced{max-height:45vh}
}
/* ---------- pipe modules screen (v0.12) ---------- */
.mods-sub{max-width:680px;margin:0 auto 12px;text-align:center;font-size:13px;line-height:1.5;color:var(--ink);opacity:.85}
.mods-statebar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 14px;max-width:680px}
.mods-statebar button{padding:7px 13px;font-size:12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px}
.mods-statebar button .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.mods-statebar button.on{background:var(--aqua);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.mods-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:780px;margin:0 auto 24px}
@media(min-width:780px){.mods-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mod-cell{background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;padding:8px 10px 7px;box-shadow:var(--shadow)}
.mod-cell canvas{width:100%;height:auto;display:block;border-radius:10px}
.mod-cell .mname{font-size:12px;font-weight:700;color:var(--ink);margin-top:6px}
.mod-cell .mmeta{font-size:10px;color:var(--ink);opacity:.7}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  background:rgba(6,20,30,.45);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.obox{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:22px 24px;
  width:min(92vw,420px);text-align:center;box-shadow:var(--shadow);max-height:92vh;overflow-y:auto}
.obox h1{font-size:clamp(22px,5vw,32px);letter-spacing:2px;margin-bottom:8px;color:var(--hint)}
.obox p{font-size:14px;color:var(--mut);margin:4px 0}
.obox .btns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
#umaWin{width:150px;height:150px;margin:2px auto}
.reward{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:12px;font-weight:800;font-size:14px;
  background:linear-gradient(160deg,rgba(40,196,232,.25),rgba(61,220,132,.25));border:1px solid var(--card-b);color:var(--hint)}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.overlay.on .obox{animation:pop .3s ease-out}
@keyframes shakeS{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
.shakeS{animation:shakeS .3s linear}

/* ============ v1.0: кампания, звёзды, чипы, финал ============ */
#scr-campaign .screen-scroll{padding-bottom:30px}
.campaign-head{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px}
.campaign-actions{display:flex;justify-content:center;padding:12px 4px 0}
.campaign-actions button{min-width:180px}
.chips-line{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-b);
  border-radius:14px;padding:7px 14px;box-shadow:var(--shadow);font-weight:800;font-size:14px;color:var(--hint)}
.chips-line .chipico{font-size:18px;line-height:1}
.chips-line .chipbar{width:120px;height:8px;border-radius:5px;background:rgba(120,160,180,.3);overflow:hidden}
.chips-line .chipbar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--emerald));border-radius:5px;transition:width .4s}
.chips-line .keymsg{font-size:11px;color:var(--hint2);font-weight:700}
.campaign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  width:min(94vw,680px);margin:12px auto 6px}
.lv-card{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  padding:10px 10px 8px;min-height:96px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .12s,filter .15s;font:inherit;color:var(--ink);text-align:left}
.lv-card:active{transform:scale(.96)}
@media (hover:hover){.lv-card:hover{filter:brightness(1.06)}}
.lv-card .lv-num{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--aqua2)}
[data-theme="dark"] .lv-card .lv-num{color:var(--aqua)}
.lv-card .lv-name{font-size:15px;font-weight:800;line-height:1.15}
.lv-card .lv-stars{font-size:15px;letter-spacing:2px;color:#d8b23a;min-height:18px}
.lv-card .lv-stars .off{opacity:.25}
.lv-card .lv-meta{font-size:11px;color:var(--mut)}
.lv-card.locked{opacity:.55;cursor:default;filter:saturate(.4)}
.lv-card.locked .lv-name::after{content:' 🔒'}
.lv-card .lv-new{position:absolute;top:8px;right:8px;background:linear-gradient(160deg,var(--aqua),var(--aqua2));
  color:#04222e;font-size:9px;font-weight:900;border-radius:8px;padding:2px 6px;letter-spacing:.5px}
/* звёзды в окне победы */
#w-stars{display:flex;justify-content:center;gap:10px;margin:6px 0 2px}
#w-stars .st{font-size:38px;line-height:1;color:#d8b23a;opacity:.22;transform:scale(.6)}
#w-stars .st.on{opacity:1;text-shadow:0 0 16px rgba(216,178,58,.65)}
.overlay.on #w-stars .st.on{animation:starPop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.overlay.on #w-stars .st.on:nth-child(2){animation-delay:.18s}
.overlay.on #w-stars .st.on:nth-child(3){animation-delay:.36s}
@keyframes starPop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#w-sub{font-size:13px;color:var(--mut)}
/* HUD: название уровня */
#lvlTitle{position:absolute;top:calc(var(--chrome-h) + 6px);left:50%;transform:translateX(-50%);z-index:5;
  pointer-events:none;text-align:center;max-width:min(60vw,420px)}
#lvlTitle .lt-name{font-size:clamp(13px,2.4vw,17px);font-weight:800;color:var(--hint);letter-spacing:.5px;
  background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;padding:4px 12px;
  box-shadow:var(--shadow);display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#lvlTitle .lt-sub{font-size:10px;font-weight:700;color:var(--dim);margin-top:3px;letter-spacing:.4px}
/* финальный экран */
#ov-final .obox{max-width:420px}
#finalCv{width:230px;height:190px;margin:4px auto;display:block;animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#f-key{display:inline-block;margin:4px auto 8px;padding:8px 18px;border-radius:14px;font-weight:900;font-size:15px;
  background:linear-gradient(160deg,rgba(255,214,90,.35),rgba(255,150,60,.3));border:1px solid rgba(255,190,80,.6);
  color:var(--hint);letter-spacing:1px;box-shadow:0 0 22px rgba(255,200,90,.35)}
/* рамка тревоги при кислоте рядом с Умой */
#acidFrame{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;
  box-shadow:inset 0 0 90px rgba(255,40,40,.5);border:3px solid rgba(255,60,60,.55);border-radius:18px}
#acidFrame.on{display:block;animation:acidPulse 1s ease-in-out infinite}
@keyframes acidPulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>

<script>
/* ===== pipes-lib v0.12 · модули труб style_01 «Pixar Glass» =====
   Тот же код рисует трубы в игре и в наборе модулей (меню → «МОДУЛИ ТРУБ»). */
/* =====================================================================
   АКВА-БУМ · БИБЛИОТЕКА МОДУЛЕЙ ТРУБ — style_01 «Pixar Glass» (v0.12)
   Единый код для игры (Canvas 2D) и для набора ассетов (node-canvas).
   Модули: прямые S/M/L, угол 90°, тройник, крестовина, муфта, торец,
   заглушка, U-ловушка. Состояния: пусто/вода/кислота/лёд/пар/сюрприз.
   Геометрия — в метрах, Y вверх; рендер — в экранных px (Y вниз).
   ===================================================================== */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PLIB = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------- утилиты ------------------------- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashSeed(s) {
    let h = 2166136261;
    if (typeof s === 'number') h ^= s | 0;
    else { s = String(s == null ? 'p' : s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } }
    return h >>> 0;
  }
  function roundPoly(pts, r, segs) {
    segs = segs || 6;
    if (!r || pts.length < 3) return pts.slice();
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      const v1 = [p0[0] - p1[0], p0[1] - p1[1]], v2 = [p2[0] - p1[0], p2[1] - p1[1]];
      const l1 = Math.hypot(v1[0], v1[1]) || 1, l2 = Math.hypot(v2[0], v2[1]) || 1;
      const rr = Math.min(r, l1 * 0.5, l2 * 0.5);
      const a = [p1[0] + v1[0] / l1 * rr, p1[1] + v1[1] / l1 * rr];
      const b = [p1[0] + v2[0] / l2 * rr, p1[1] + v2[1] / l2 * rr];
      out.push(a);
      for (let s = 1; s <= segs; s++) {
        const tt = s / segs, mt = 1 - tt;
        out.push([mt * mt * a[0] + 2 * mt * tt * p1[0] + tt * tt * b[0],
                  mt * mt * a[1] + 2 * mt * tt * p1[1] + tt * tt * b[1]]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function polyPointAt(pts, t) { /* t in [0,1] по длине */
    let L = 0; const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
    let want = t * L;
    for (let i = 0; i < seg.length; i++) {
      if (want <= seg[i] || i === seg.length - 1) {
        const k = seg[i] ? want / seg[i] : 0;
        return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k];
      }
      want -= seg[i];
    }
    return pts[pts.length - 1];
  }
  function polyNormalAt(pts, t) {
    const a = polyPointAt(pts, Math.max(0, t - 0.02)), b = polyPointAt(pts, Math.min(1, t + 0.02));
    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    return [-dy / l, dx / l];
  }
  function cutBelow(paths, y) { /* части полилиний НИЖЕ уровня y (y вниз) */
    const runs = [];
    for (const pts of paths) {
      let cur = null;
      const openRun = (p) => { cur = [p]; runs.push(cur); };
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const da = a[1] - y, db = b[1] - y;
        if (da > 0 && db > 0) { if (!cur) openRun(a); cur.push(b); }
        else if (da > 0 && db <= 0) { if (!cur) openRun(a); const k = da / (da - db); cur.push([a[0] + (b[0] - a[0]) * k, y]); cur = null; }
        else if (da <= 0 && db > 0) { const k = -da / (db - da); openRun([a[0] + (b[0] - a[0]) * k, y]); cur.push(b); }
        else cur = null;
      }
    }
    return runs.filter(r => r.length > 1);
  }
  function cutBelowLine(pts, A, B) { /* часть полилинии ниже (по знаку) прямой A→B в экранных координатах */
    const side = (p) => (B[0] - A[0]) * (p[1] - A[1]) - (B[1] - A[1]) * (p[0] - A[0]);
    /* выбираем знак «погружённой» стороны по наиболее низкой точке полилинии */
    let lo = pts[0];
    for (const p of pts) if (p[1] > lo[1]) lo = p;
    const sgn = Math.sign(side(lo)) || 1;
    const runs = []; let cur = null;
    const openRun = (p) => { cur = [p]; runs.push(cur); };
    const inter = (a, b) => { const sa = side(a) * sgn, sb = side(b) * sgn; const k = sa / (sa - sb); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; };
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], da = side(a) * sgn, db = side(b) * sgn;
      if (da > 0 && db > 0) { if (!cur) openRun(a); cur.push(b); }
      else if (da > 0 && db <= 0) { if (!cur) openRun(a); cur.push(inter(a, b)); cur = null; }
      else if (da <= 0 && db > 0) { openRun(inter(a, b)); cur.push(b); }
      else cur = null;
    }
    return runs.filter(r => r.length > 1);
  }
  function bbox(pts) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
    return [x0, y0, x1, y1];
  }
  function strokePoly(ctx, pts, w, style, alpha) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.globalAlpha = (alpha == null ? 1 : alpha);
    ctx.strokeStyle = style; ctx.lineWidth = Math.max(0.6, w);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke(); ctx.restore();
  }
  function offset(pts, dx, dy) { return pts.map(p => [p[0] + dx, p[1] + dy]); }
  function offsetNormal(pts, d) { /* сдвиг вдоль локальной нормали трубы */
    return pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
      return [p[0] - dy / l * d, p[1] + dx / l * d];
    });
  }

  /* ------------------------- палитры ------------------------- */
  const THEMES = {
    light: {
      outline: 'rgba(146,186,214,0.92)',
      casingTop: '#F6FCFF', casingMid: '#E3F1FD', casingBot: '#C2DFF4',
      casingAlpha: 0.31,
      wall: 'rgba(255,255,255,0.36)',
      channel: 'rgba(222,242,255,0.28)',
      glossHi: 'rgba(255,255,255,0.95)', glossLo: 'rgba(255,255,255,0.40)',
      shadow: 'rgba(74,124,162,0.20)',
      rim: '#FFFFFF', rimShade: 'rgba(178,209,231,0.98)', rimInner: 'rgba(236,249,255,0.96)',
      water: { a: '#A6E2FF', b: '#2E9BF0', core: 'rgba(26,116,196,0.35)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.85)' },
      acid:  { a: '#D2FCA0', b: '#2FBF5F', core: 'rgba(22,126,62,0.35)', crest: 'rgba(248,255,230,0.95)', bubble: 'rgba(240,255,220,0.9)' },
      ice:   { a: '#FBFEFF', b: '#A8DCFB', core: 'rgba(112,178,226,0.42)', crest: 'rgba(255,255,255,1)', bubble: 'rgba(255,255,255,0.97)' },
      steam: { a: 'rgba(255,255,255,0.99)', b: 'rgba(255,219,236,0.95)', core: 'rgba(255,186,216,0.4)', crest: 'rgba(255,255,255,1)', bubble: 'rgba(255,255,255,0.95)' },
      surprise: { a: '#FFFEF8', b: '#F3E2C4', core: 'rgba(196,160,100,0.25)', mark: '#F0B23F', markInk: '#B9761F', ribbon: '#F2A63B' }
    },
    dark: {
      outline: 'rgba(126,196,232,0.55)',
      casingTop: 'rgba(240,252,255,0.42)', casingMid: 'rgba(196,231,250,0.30)', casingBot: 'rgba(150,200,232,0.22)',
      casingAlpha: 1,
      wall: 'rgba(190,230,250,0.20)',
      channel: 'rgba(14,38,56,0.28)',
      glossHi: 'rgba(255,255,255,0.50)', glossLo: 'rgba(255,255,255,0.18)',
      shadow: 'rgba(0,0,0,0.35)',
      rim: 'rgba(232,248,255,0.95)', rimShade: 'rgba(120,180,215,0.9)', rimInner: 'rgba(24,58,80,0.9)',
      water: { a: '#7ED0FF', b: '#1E7FD6', core: 'rgba(6,40,80,0.45)', crest: 'rgba(230,248,255,0.9)', bubble: 'rgba(220,245,255,0.75)' },
      acid:  { a: '#B9F288', b: '#1FA24E', core: 'rgba(6,60,30,0.45)', crest: 'rgba(240,255,224,0.9)', bubble: 'rgba(230,255,210,0.75)' },
      ice:   { a: '#EAF9FF', b: '#9FD3F5', core: 'rgba(60,120,170,0.4)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.85)' },
      steam: { a: 'rgba(255,255,255,0.85)', b: 'rgba(255,196,222,0.7)', core: 'rgba(255,170,205,0.3)', crest: 'rgba(255,255,255,0.95)', bubble: 'rgba(255,255,255,0.8)' },
      surprise: { a: '#FDF7EA', b: '#E7D2AC', core: 'rgba(150,116,64,0.3)', mark: '#F0B23F', markInk: '#A8671A', ribbon: '#F2A63B' }
    }
  };

  /* ------------------------- модули (метры, Y вверх) ------------------------- */
  /* paths — полилинии осевой линии; sf — уровень жидкости (м, Y вверх)     */
  const MODULES = [
    { id: 'straightS', ru: 'Прямая S', en: 'Straight S', size: '0.5 м', sizeM: 0.5, paths: [[[0, 0], [0.5, 0]]], sf: 0.004, ports: 2 },
    { id: 'straightM', ru: 'Прямая M', en: 'Straight M', size: '1.0 м', sizeM: 1.0, paths: [[[0, 0], [1.0, 0]]], sf: 0.004, ports: 2 },
    { id: 'straightL', ru: 'Прямая L', en: 'Straight L', size: '1.5 м', sizeM: 1.5, paths: [[[0, 0], [1.5, 0]]], sf: 0.004, ports: 2 },
    { id: 'elbow', ru: 'Угол 90°', en: 'Elbow 90°', size: 'r 0.12 м', sizeM: 0.5, paths: [[[0, 0], [0.5, 0], [0.5, 0.5]]], sf: 0.0, ports: 2, rc: 0.12 },
    { id: 'tee', ru: 'Тройник', en: 'Tee', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]], [[0, 0], [0, 0.5]]], sf: 0.02, ports: 3 },
    { id: 'cross', ru: 'Крестовина', en: 'Cross', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]], [[0, -0.25], [0, 0.25]]], sf: 0.03, ports: 4 },
    { id: 'coupling', ru: 'Муфта', en: 'Coupling', size: '0.25 м', sizeM: 0.25, paths: [[[-0.25, 0], [0.25, 0]]], sf: 0.004, ports: 2, collars: [{ t: 0.5, k: 1.55 }] },
    { id: 'end', ru: 'Торец', en: 'Open end', size: '0.5 м', sizeM: 0.5, paths: [[[-0.25, 0], [0.25, 0]]], sf: 0.004, ports: 1, endRim: true },
    { id: 'cap', ru: 'Заглушка', en: 'Cap', size: '0.5 м', sizeM: 0.5, paths: [[[-0.5, 0], [0.1, 0]]], sf: 0.004, ports: 1, capAt: 0.1 },
    { id: 'utrap', ru: 'U-ловушка', en: 'U-trap', size: '0.5 × 0.5', sizeM: 0.5, paths: [[[-0.25, 0.25], [-0.25, -0.25], [0.25, -0.25], [0.25, 0.25]]], sf: 0.01, ports: 2, rc: 0.12 }
  ];
  const MOD_BY_ID = {}; MODULES.forEach(m => MOD_BY_ID[m.id] = m);

  const STATES = ['empty', 'water', 'acid', 'ice', 'steam', 'surprise'];
  const STATE_RU = { empty: 'Пусто', water: 'Вода', acid: 'Кислота', ice: 'Лёд', steam: 'Пар', surprise: 'Сюрприз' };
  const STATE_EN = { empty: 'Empty', water: 'Water', acid: 'Acid', ice: 'Ice', steam: 'Steam', surprise: 'Surprise' };
  const STATE_COL = { empty: '#8FA6B8', water: '#2E9BF0', acid: '#2FBF5F', ice: '#9FD3F5', steam: '#F1A7C4', surprise: '#E8A33D' };

  /* геометрия модуля -> экранные px (Y вниз), центр (0,0) */
  function modGeometry(id, st) {
    st = st || {};
    const m = MOD_BY_ID[id];
    const scale = st.scale || 160;              /* px на метр (длины) */
    const wOut = st.wOut || Math.max(20, scale * 0.167);
    const wIn = st.wIn || wOut * 0.76;
    const rc = (st.rc != null ? st.rc : (m.rc || 0)) * scale;
    const paths = m.paths.map(p => {
      const pp = p.map(q => [q[0] * scale, -q[1] * scale]);
      return roundPoly(pp, rc, 7);
    });
    /* центрирование */
    const all = paths.flat();
    const bb = bbox(all);
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    const cpaths = paths.map(p => offset(p, -cx, -cy));
    const extras = { collars: [], cap: null, endRim: null };
    const surfY = -m.sf * scale - cy;
    if (m.collars) for (const c of m.collars) {
      const p = cpaths[0];
      const q = polyPointAt(p, c.t);
      extras.collars.push({ p: q, w: wOut * (c.k || 1.5) });
    }
    if (m.capAt != null) {
      const p = cpaths[0];
      const q = polyPointAt(p, 1);
      extras.cap = { p: q, dir: [1, 0] };
    }
    if (m.endRim) { const p = cpaths[0]; extras.endRim = { p: polyPointAt(p, 1) }; }
    return { paths: cpaths, wOut, wIn, surfY, extras, bb: bbox(cpaths.flat()) };
  }

  /* ------------------------- рендер трубы ------------------------- */
  /* o = { pts, wOut, wIn, state, runs, t, seed, dark, rims:bool, hidden:bool } */
  function drawTube(ctx, o) {
    const th = THEMES[o.dark ? 'dark' : 'light'];
    const pts = o.pts; if (!pts || pts.length < 2) return;
    const wOut = o.wOut, wIn = o.wIn == null ? wOut * 0.76 : o.wIn;
    const st = o.state || 'empty';
    const t = o.t || 0, rnd = mulberry32(hashSeed(o.seed));
    const bb = bbox(pts);

    /* Pass 2: liquids are composited after every glass wall/joint so no connector
       or crossing tube can hide the continuous stream. The narrower wIn keeps the
       outer tube contour visible. */
    if (o.liquidOnly) {
      if (st === 'steam') {
        const runs = o.runs && o.runs.length ? o.runs : [{pts}];
        for (const run of runs) drawSteamBody(ctx, run.pts || run, wIn, th, t, rnd, o);
      }
      else if (st !== 'surprise' && st !== 'empty' && o.runs && o.runs.length) {
        const col = o.color || th[st] || th.water;
        for (const run of o.runs) drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb);
      }
      return;
    }

    /* 1. тень */
    strokePoly(ctx, offset(pts, wOut * 0.06, wOut * 0.30), wOut * 1.0, th.shadow, o.dark ? 0.5 : 0.75);
    /* 2. белая граница (контур) */
    strokePoly(ctx, pts, wOut + Math.max(3, wOut * 0.15), th.outline, 0.95);
    /* 3. стеклянная оболочка */
    const cg = ctx.createLinearGradient(0, bb[1] - wOut * 0.6, 0, bb[3] + wOut * 0.6);
    if (st === 'surprise') {
      cg.addColorStop(0, th.surprise.a); cg.addColorStop(1, th.surprise.b);
      strokePoly(ctx, pts, wOut, cg, 1);
    } else {
      cg.addColorStop(0, th.casingTop); cg.addColorStop(0.42, th.casingMid); cg.addColorStop(1, th.casingBot);
      strokePoly(ctx, pts, wOut, cg, th.casingAlpha);
    }
    /* 4. канал */
    if (st === 'surprise') {
      const sg = ctx.createLinearGradient(0, bb[1], 0, bb[3]);
      sg.addColorStop(0, '#FFFDF6'); sg.addColorStop(1, '#EFD9B4');
      strokePoly(ctx, pts, wIn, sg, 1);
    } else {
      strokePoly(ctx, pts, (wIn + wOut) / 2, th.wall, 0.9);
      strokePoly(ctx, pts, wIn, th.channel, 0.9);
    }

    /* 5. содержимое (в игровом кадре приходит отдельным верхним проходом) */
    if (!o.skipLiquid) {
      if (st === 'steam') {
        const runs = o.runs && o.runs.length ? o.runs : [{pts}];
        for (const run of runs) drawSteamBody(ctx, run.pts || run, wIn, th, t, rnd, o);
      }
      else if (st !== 'surprise' && st !== 'empty' && o.runs && o.runs.length) {
        const col = o.color || th[st] || th.water;
        for (const run of o.runs) drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb);
      }
    }

    /* 6. блики стекла — по нормали, чтобы не закрывать жидкость вертикальных труб */
    strokePoly(ctx, offsetNormal(pts, -wOut * 0.27), wOut * 0.20, th.glossHi, 0.9);
    strokePoly(ctx, offsetNormal(pts, -wOut * 0.05), wOut * 0.07, th.glossLo, 0.85);
    strokePoly(ctx, offsetNormal(pts, wOut * 0.24), wOut * 0.10, th.glossLo, 0.55);

    /* 7. сюрприз: «?» и бант (поверх непрозрачного корпуса) */
    if (st === 'surprise') {
      const c = polyPointAt(pts, 0.5), n = polyNormalAt(pts, 0.5);
      const r = wOut * 0.40;
      ctx.save();
      ctx.fillStyle = '#E39A2B'; ctx.beginPath(); ctx.arc(c[0], c[1], r * 1.14, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF6DE'; ctx.beginPath(); ctx.arc(c[0], c[1], r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = Math.max(1.6, wOut * 0.055); ctx.stroke();
      ctx.fillStyle = '#B9761F'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 ' + (r * 1.7).toFixed(1) + 'px sans-serif';
      ctx.fillText('?', c[0], c[1] + r * 0.10);
      ctx.restore();
      /* бант */
      ctx.save();
      const q = polyPointAt(pts, 0.5);
      ctx.translate(q[0] + n[0] * wOut * 0.55, q[1] + n[1] * wOut * 0.55);
      ctx.fillStyle = th.surprise.ribbon;
      ctx.beginPath(); ctx.ellipse(-r * 0.36, 0, r * 0.34, r * 0.20, -0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(r * 0.36, 0, r * 0.34, r * 0.20, 0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, 7); ctx.fill();
      ctx.restore();
    }

    /* 8. торцевые кольца-муфты (true/false или [голова, хвост]) */
    const rims = o.rims === false ? [false, false] : (Array.isArray(o.rims) ? o.rims : [true, true]);
    if (rims[0]) collar(ctx, pts[0], angleAt(pts, 0), wOut, th);
    if (rims[1]) collar(ctx, pts[pts.length - 1], angleAt(pts, 1), wOut, th);
    /* доп. муфты */
    if (o.collars) for (const c of o.collars) collar(ctx, c.p, c.ang || 0, c.w || wOut, th);
  }

  function angleAt(pts, t) {
    const a = polyPointAt(pts, Math.max(0, t - 0.03)), b = polyPointAt(pts, Math.min(1, t + 0.03));
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  }

  function collar(ctx, p, ang, wOut, th, k) {
    /* Прозрачная кромка стыка: только две стеклянные обводки, без заливки канала. */
    k = k || 1;
    ctx.save();
    ctx.translate(p[0], p[1]); ctx.rotate(ang);
    const rx = wOut * 0.21 * k, ry = wOut * (0.63 + 0.08 * (k - 1));
    ctx.lineWidth = Math.max(1.1, wOut * 0.055);
    ctx.strokeStyle = th.rimShade;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = Math.max(0.8, wOut * 0.028);
    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.beginPath(); ctx.ellipse(0, 0, rx * 0.72, ry * 0.78, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  function drawLiquidRun(ctx, run, wIn, col, th, t, rnd, st, bb) {
    const pts = run.pts || run;
    if (!pts || pts.length < 2) return;
    const lg = ctx.createLinearGradient(0, bb[1], 0, bb[3] + wIn * 0.6);
    lg.addColorStop(0, col.a); lg.addColorStop(1, col.b);
    const iceFill = st === 'ice';
    strokePoly(ctx, pts, wIn * 0.96, lg, iceFill ? 1 : 0.96);
    strokePoly(ctx, pts, wIn * 0.52, col.core, iceFill ? 0.9 : 0.8);
    if (iceFill) {
      /* морозная шапка вдоль верха сегмента */
      strokePoly(ctx, offset(pts, 0, -wIn * 0.24), wIn * 0.30, 'rgba(255,255,255,0.92)', 0.95);
      strokePoly(ctx, offset(pts, 0, -wIn * 0.22), wIn * 0.10, 'rgba(214,240,255,0.95)', 0.9);
    }
    /* поверхность: волна + гребень */
    const surfaces = run.surfs || (run.surf != null ? [run.surf] : []);
    for (const surfaceT of surfaces) {
      const sp = polyPointAt(pts, surfaceT);
      const n = polyNormalAt(pts, surfaceT);
      const width = wIn * 0.86;
      ctx.save();
      ctx.strokeStyle = col.crest; ctx.lineWidth = Math.max(1.4, wIn * 0.10); ctx.lineCap = 'round';
      ctx.beginPath();
      const px = -n[1], py = n[0];
      const stableFluid = st === 'water' || st === 'acid' || st === 'ice';
      const ph = stableFluid ? 0 : (t * 2.2 + (run.ph || 0) + surfaceT * 4);
      for (let i = 0; i <= 12; i++) {
        const u = i / 12 - 0.5;
        const wob = stableFluid ? 0 : (Math.sin(u * 6.0 + ph) * wIn * 0.07 + Math.sin(u * 11.0 - ph * 1.4) * wIn * 0.03);
        const X = sp[0] + px * u * width + n[0] * wob, Y = sp[1] + py * u * width + n[1] * wob;
        i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      ctx.stroke(); ctx.restore();
      const cg = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], wIn * 0.75);
      cg.addColorStop(0, 'rgba(255,255,255,0.45)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(sp[0], sp[1], wIn * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    /* Water and acid use stable, clean fills; no continuously bobbing bubble layer. */
    const nb = (st === 'water' || st === 'acid' || st === 'ice') ? 0 : Math.max(2, Math.round(pts.length * 0.55));
    for (let i = 0; i < nb; i++) {
      const u = 0.06 + rnd() * 0.88;
      const cnt = polyPointAt(pts, u), nrm = polyNormalAt(pts, u);
      const off = (rnd() - 0.5) * wIn * 0.55;
      const bob = Math.sin(t * 1.7 + rnd() * 6.28) * wIn * 0.10;
      const r = Math.min(wIn * (0.06 + rnd() * 0.09), 9);
      const X = cnt[0] + nrm[0] * (off + bob), Y = cnt[1] + nrm[1] * (off + bob);
      ctx.save();
      ctx.fillStyle = col.bubble; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.95; ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = Math.max(0.8, r * 0.28);
      ctx.beginPath(); ctx.arc(X, Y, r * 0.72, Math.PI * 1.05, Math.PI * 1.75); ctx.stroke();
      ctx.restore();
    }
    /* Ice markings are fixed in space: no random crystals, particles, or shimmer. */
    if (st === 'ice') {
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.88)'; ctx.lineWidth = Math.max(1.1, wIn * 0.055);
      const n = Math.max(5, Math.round(pts.length * 1.2));
      for (let i = 0; i < n; i++) {
        const u = 0.08 + (i + 0.5) / n * 0.84;
        const c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
        const half = Math.min(wIn * (0.17 + (i % 3) * 0.035), 13), a = (i % 2 ? 0.72 : -0.58);
        ctx.globalAlpha = 0.58 + (i % 3) * 0.10;
        ctx.beginPath();
        ctx.moveTo(c[0] - Math.cos(a) * half, c[1] - Math.sin(a) * half);
        ctx.lineTo(c[0] + Math.cos(a) * half, c[1] + Math.sin(a) * half);
        ctx.stroke();
        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.74)';
          ctx.beginPath(); ctx.arc(c[0] + nm[0] * wIn * 0.20, c[1] + nm[1] * wIn * 0.20, Math.min(wIn * 0.035, 2.5), 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
    }
  }

  function drawSteamBody(ctx, pts, wIn, th, t, rnd, o) {
    const col = th.steam;
    /* лёгкая дымка внутри */
    strokePoly(ctx, pts, wIn * 0.9, 'rgba(255,231,243,0.75)', 0.85);
    strokePoly(ctx, pts, wIn * 0.95, col.b, 0.55);
    const n = Math.max(6, Math.round(pts.length * 1.2));
    for (let i = 0; i < n; i++) {
      const u = (i + rnd() * 0.4) / n;
      const c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
      const off = (rnd() - 0.5) * wIn * 0.4;
      const r = Math.min(wIn * (0.30 + rnd() * 0.26), 26);
      const drift = 0; /* node-id-seeded, fixed steam position: no bob/drift flicker */
      const X = c[0] + nm[0] * (off + drift), Y = c[1] + nm[1] * (off + drift);
      const g = ctx.createRadialGradient(X, Y, 0, X, Y, r * 1.6);
      g.addColorStop(0, col.a); g.addColorStop(0.55, 'rgba(255,240,248,0.75)'); g.addColorStop(1, 'rgba(255,240,248,0)');
      ctx.save(); ctx.globalAlpha = 0.9; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(X, Y, r * 1.6, 0, 7); ctx.fill(); ctx.restore();
    }
    /* капельки */
    ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 3; i++) {
      const u = 0.15 + rnd() * 0.7, c = polyPointAt(pts, u), nm = polyNormalAt(pts, u);
      ctx.globalAlpha = 0.62;
      ctx.beginPath(); ctx.arc(c[0] + nm[0] * wIn * 0.25, c[1] + nm[1] * wIn * 0.25, wIn * 0.05, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  /* ------------------------- модуль целиком ------------------------- */
  /* рисует модуль в точке (x,y) — центр; opts: {state, scale, t, dark, seed, alpha, wOut} */
  function drawModule(ctx, id, x, y, opts) {
    opts = opts || {};
    const geo = modGeometry(id, opts);
    const st = opts.state || 'empty';
    ctx.save();
    ctx.translate(x, y);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;
    const pathRuns = geo.paths.map((p,pi) => (st === 'empty' || st === 'steam' || st === 'surprise') ? [] :
      cutBelow([p], geo.surfY).map((r, i) => ({ pts: r, surf: surfaceIdx(r), ph: pi * 1.7 + i * 0.9 })));
    // Draw all glass branches first, then the liquid pass across tees/crosses.
    geo.paths.forEach((p, pi) => drawTube(ctx, {
      pts: p, wOut: geo.wOut, wIn: geo.wIn, state: st, runs: pathRuns[pi],
      t: opts.t || 0, seed: (opts.seed || id) + st + pi, dark: opts.dark,
      rims: opts.rims !== false, collars: [], skipLiquid: true
    }));
    geo.paths.forEach((p, pi) => drawTube(ctx, {
      pts: p, wOut: geo.wOut, wIn: geo.wIn, state: st, runs: pathRuns[pi],
      t: opts.t || 0, seed: (opts.seed || id) + st + pi, dark: opts.dark, liquidOnly: true
    }));
    /* муфты */
    for (const c of (geo.extras.collars || [])) collar(ctx, c.p, angleAt(geo.paths[0], c.t || 0.5), c.w, THEMES[opts.dark ? 'dark' : 'light'], 1);
    /* заглушка-домик */
    if (geo.extras.cap) {
      const th = THEMES[opts.dark ? 'dark' : 'light'];
      const p = geo.extras.cap.p, w = geo.wOut;
      const g = ctx.createLinearGradient(p[0] - w, p[1] - w / 2, p[0] + w, p[1] + w / 2);
      g.addColorStop(0, th.casingTop); g.addColorStop(1, th.casingBot);
      ctx.save();
      ctx.beginPath(); ctx.arc(p[0], p[1], w * 0.52, -Math.PI / 2, Math.PI / 2); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = th.outline; ctx.lineWidth = Math.max(2, w * 0.10); ctx.stroke();

let AC=null,master=null,flowGain=null,flowSrc=null,sndOn=true,humG=null,hissBuffer=null;
try{sndOn=localStorage.getItem('aquaboom_sound')!=='off';}catch(e){}
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=sndOn?.5:0;master.connect(AC.destination);
  humG=AC.createGain();humG.gain.value=.012;humG.connect(master);          /* эмбиент лаборатории */
  [50,50.7,100.3].forEach(f=>{const o=AC.createOscillator();o.frequency.value=f;o.type='sine';o.connect(humG);o.start();});
  /* Continuous water sound follows measured flow; one quiet deterministic noise bed. */
  const noise=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*2)),AC.sampleRate),data=noise.getChannelData(0);
  let seed=0xA17B00;for(let i=0;i<data.length;i++){seed=(seed*1664525+1013904223)>>>0;data[i]=((seed/4294967296)*2-1)*.24;}
  flowGain=AC.createGain();flowGain.gain.value=0;
  const low=AC.createBiquadFilter();low.type='lowpass';low.frequency.value=900;low.Q.value=.65;
  flowSrc=AC.createBufferSource();flowSrc.buffer=noise;flowSrc.loop=true;flowSrc.connect(low);low.connect(flowGain);flowGain.connect(master);flowSrc.start();
  hissBuffer=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*.24)),AC.sampleRate);
  const hiss=hissBuffer.getChannelData(0);seed=0xAC1D;
  for(let i=0;i<hiss.length;i++){seed=(seed*1103515245+12345)>>>0;hiss[i]=((seed/4294967296)*2-1)*.36;}
 } if(AC.state==='suspended')AC.resume(); }
function softAcidHiss(){
 if(!sndOn||!AC||!master||!hissBuffer)return;
 const t=AC.currentTime,src=AC.createBufferSource(),filter=AC.createBiquadFilter(),gain=AC.createGain();
 src.buffer=hissBuffer;filter.type='bandpass';filter.frequency.value=1750;filter.Q.value=.72;
 gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.028,t+.035);gain.gain.exponentialRampToValueAtTime(.0001,t+.22);
 src.connect(filter);filter.connect(gain);gain.connect(master);src.start(t);src.stop(t+.24);
}
function tone(f,dur,type,vol,slide,delay){ if(!sndOn||!AC)return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02); }

function runPoint(n,t){ /* точка на полилинии по длине дуги */
 let s=0;
 for(let i=1;i<n.pts.length;i++){const len=n.len[i-1];
  if(t<=s+len||i===n.pts.length-1){const f=Math.max(0,Math.min(1,(t-s)/len));
   const p0=n.pts[i-1],p1=n.pts[i];
   return [p0[0]+(p1[0]-p0[0])*f,p0[1]+(p1[1]-p0[1])*f,p0[2]+(p1[2]-p0[2])*f];}
  s+=len;}
 return n.pts[n.pts.length-1].slice();
}
/* Пул камеры: позиции слотов (локальные координаты), снизу вверх (ближе к порту — первее).
   Центр и радиус — те же, что у отрисовки батисферы (drawChamber). */
function poolPts(n){
 const kind=n.roomType||((n.tank==='acid')?'acid':n.finish?'finish':'start');
 const cfg=CHAMBERS[kind]||CHAMBERS.start;
 const C=n.roomCenter||cfg.center, r=n.roomRadius||cfg.r;
 const a=n.pts[0],b=n.pts[n.pts.length-1];
 let d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];const dl=Math.hypot(d[0],d[1],d[2]);
 d=dl<1e-9?[0,-1,0]:d.map(v=>v/dl);
 const key=C.join()+'|'+r+'|'+d.join();
 if(n._pool&&n._pool.key===key)return n._pool.pts;
 let e=[-d[1],d[0],0];const el=Math.hypot(e[0],e[1]);
 e=el<1e-6?[1,0,0]:e.map(v=>v/el);
 const pts=[];
 for(let j=0;j<40;j++){
  const t=r*0.72-j*BALL_SPACING*0.87;if(t<-r*0.8)break;
  const hw=Math.sqrt(Math.max(0,(r*0.82)*(r*0.82)-t*t));
  const shift=j%2?0.5:0;
  for(let i=-30;i<=30;i++){const x=(i+shift)*BALL_SPACING;if(Math.abs(x)>hw)continue;
   pts.push([C[0]+d[0]*t+e[0]*x,C[1]+d[1]*t+e[1]*x,C[2]+d[2]*t+e[2]*x]);}
 }
 n._pool={key,pts};return pts;
}
/* локальная позиция шарика */
function ballLocal(b){
 const n=ND[b.node];if(!n)return null;
 if(n.tank){const P=poolPts(n);
  if(!P.length)return n.pts[n.pts.length-1].slice();
  return P[Math.max(0,Math.min(P.length-1,Math.round(b.u)))].slice();}
 return runPoint(n,b.u);
}
/* начальная позиция k-го шарика в узле: снизу вверх по дуге */
function ballLayoutU(n,k){
 if(n.tank)return k;
 const fromStart=worldH(n.pts[0])<=worldH(n.pts[n.pts.length-1]);
 const u=fromStart?BALL_R+k*BALL_SPACING:n.L-BALL_R-k*BALL_SPACING;
 return clamp(u,0,n.L);
}
function fillNode(n,idx,type,fraction,offset){
 if(!type||type==='empty'||!(fraction>0))return;
 const base=baseSlotsOf(n);
 const cnt=Math.max(0,Math.min(base,n.slots-offset,Math.round(fraction*base)));
 for(let k=0;k<cnt;k++)balls.push(new Ball(type,idx,ballLayoutU(n,k+offset)));
}
function pieceForSource(sid,s,isTank){
 const cands=[];ND.forEach((n,i)=>{if(n.sourceId===sid)cands.push(i);});
 if(!cands.length)return -1;
 if(isTank)return cands[0];
 let best=cands[0],bd=Infinity;
 for(const i of cands){const n=ND[i];const d=s<n.s0?n.s0-s:s>n.s1?s-n.s1:0;if(d<bd){bd=d;best=i;}}
 return best;
}
function umaBall(){return balls.find(b=>b.type==='uma'&&!b.dead)||null;}
function poolCount(i){let c=0;for(const b of balls)if(!b.dead&&b.node===i)c++;return c;}
function poolSorted(i){return balls.filter(b=>!b.dead&&b.node===i).sort((p,q)=>p.u-q.u);}
function reindexPool(i){poolSorted(i).forEach((b,k)=>{b.u=k;});}
function liquidIn(i){let c=0;for(const b of balls)if(!b.dead&&b.node===i&&b.type!=='uma')c++;return c;}

/* ---------- топология: контакты концов узлов через рёбра графа ---------- */
function topoAdj(){
 const adj=ND.map(()=>[]);
 ED.forEach(e=>{
  const i=nodeById(e.a),j=nodeById(e.b);
  if(i<0||j<0||i===j)return;
  const [ei,ej]=closestEndpointPair(ND[i],ND[j]);
  const ki=ei?1:0,kj=ej?1:0;
  adj[i].push({e,j,k:ki,kj});
  adj[j].push({e,j:i,k:kj,kj:ki});
 });
 return adj;
}
function edgeOpen(e){
 if(!e)return true;
 if(e.valve&&!e.open)return false;
 if(e.deviceType==='filter'&&ballNextType)return filterPasses(e,ballNextType);
 return true;
}
function filterPasses(e,type){
 if(type==='uma')return true;               /* Ума проходит всегда */
 return (e.pass||['water']).indexOf(type)>=0;
}
let ballNextType=null; /* тип шарика, для которого оцениваем рёбра (в tryTransfer) */
/* Перелив через лёд (как в v0.12: гребень льда). Если за льдом узел u с водой выше гребня
   и выше дальней стороны, добавляется виртуальное ребро u → w через цепочку ледяных узлов. */
/* перелив: шарик у конца узла, выше гребня льда, переходит через лёд (PBD не даёт дойти до u=L) */
function spillTransfers(adj){
 for(let u=0;u<ND.length;u++){
  const n=ND[u];if(!n||n.tank)continue;
  for(const c of adj[u]){
   if(!c.virtual)continue;
   const L=n.L,near=2*BALL_SPACING;
   for(const b of balls){
    if(b.dead||b.node!==u||b.type==='ice')continue;
    const atEnd=c.k===1?(L-b.u)<=near:b.u<=near;
    if(!atEnd)continue;
    const q=ballLocal(b);if(!q)continue;
    if(worldH(q)<=c.crest-0.01)continue;
    if(!canEnterAt(c.P||ND[c.j].pts[c.kj?ND[c.j].pts.length-1:0],b,true,false,u))continue;
    b.node=c.j;b.u=c.kj?ND[c.j].L:0;b.v=0;
    break;
   }
  }
 }
}
function spillAdj(adj){
 const hasIce=ND.map((n,i)=>balls.some(b=>!b.dead&&b.node===i&&b.type==='ice'));
 const iceCrest=ND.map((n,i)=>{let h=-Infinity;for(const b of balls){if(b.dead||b.node!==i||b.type!=='ice')continue;const q=ballLocal(b);if(q)h=Math.max(h,worldH(q));}return h;});
 const topH=ND.map((n,i)=>{let h=-Infinity;for(const b of balls){if(b.dead||b.node!==i)continue;const q=ballLocal(b);if(q)h=Math.max(h,worldH(q));}return h;});
 /* максимальная высота жидкости на стороне стыка: связная область без ледяных узлов */
 const sideTop=(start)=>{
  let best=-Infinity;const seen=new Set([start]);const st=[start];
  while(st.length){
   const v=st.pop();
   best=Math.max(best,topH[v]);
   for(const c of adj[v]){
    if(seen.has(c.j)||hasIce[c.j]||!edgeOpen(c.e))continue;
    seen.add(c.j);st.push(c.j);
   }
  }
  return best;
 };
 const out=adj.map(a=>a.slice());
 for(let u=0;u<ND.length;u++){
  const nu=ND[u];if(!nu||nu.tank||hasIce[u])continue;
  for(const k of [0,1]){
   for(const c of adj[u]){
    if(c.k!==k||!edgeOpen(c.e)||!hasIce[c.j])continue;
    /* проходим цепочку ледяных узлов до первого неледяного */
    let prev=u,cur=c.j,kin=c.kj,crest=-Infinity,ok=true,steps=0;
    while(hasIce[cur]&&steps<8){
     crest=Math.max(crest,iceCrest[cur]+PIPE_RI*0.9);
     const nxt=adj[cur].find(d=>d.k===(1-kin)&&d.j!==prev&&edgeOpen(d.e));
     if(!nxt){ok=false;break;}
     prev=cur;cur=nxt.j;kin=nxt.kj;steps++;
    }
    if(!ok||hasIce[cur]||!ND[cur]||ND[cur].tank)continue;
    const su=sideTop(u),sw=sideTop(cur);
    if(topH[u]>crest&&su>sw+0.01){
     out[u].push({e:null,virtual:true,j:cur,k,kj:kin,crest});
    }
   }
  }
 }
 return out;
}
/* соседи конца k узла i, по возрастанию высоты входа (вода стекает вниз) */
function endCandidates(adj,i,k){
 const res=[];
 for(const c of adj[i]){
  if(c.k!==k||!edgeOpen(c.e))continue;
  const m=ND[c.j];if(!m)continue;
  const P=m.pts[c.kj?m.pts.length-1:0].slice();
  let h=worldH(P);
  if(ballNextType==='magnet'&&magnetAtPiece(m))h-=0.10;   /* магнитит в свой узел */
  /* при равной высоте входа вода идёт в трубу, которая дальше спускается */
  const h2=worldH(m.pts[c.kj?0:m.pts.length-1]);
  res.push({...c,P,h,h2});
 }
 res.sort((x,y)=>(x.h-y.h)||(x.h2-y.h2));
 return res;
}
function magnetAtPiece(m){
 for(const e of ED){
  if(e.deviceType!=='magnet'||!e.active)continue;
  if(e.a===m.id||e.b===m.id)return true;
 }
 return false;
}
/* свободна ли точка P для входа шарика (никакой другой шарик не ближе 0.9·SPACING) */
function canEnterAt(P,self,ignoreIce,ignoreUma,fromNode){
 const r2=(BALL_SPACING*0.9)*(BALL_SPACING*0.9);
 for(const o of balls){
  if(o===self||o.dead)continue;
  if(ignoreIce&&o.type==='ice')continue;
  if(ignoreUma&&o.type==='uma')continue;
  if(fromNode!==undefined&&o.node===fromNode)continue;   /* шарики исходного узла удерживает PBD */
  const q=ballLocal(o);if(!q)continue;
  if((q[0]-P[0])**2+(q[1]-P[1])**2+(q[2]-P[2])**2<r2)return false;
 }
 return true;
}
/* перенос шарика через конец k узла i в соседа; true если удалось */
function tryTransfer(b,i,k,adj){
 ballNextType=b.type;
 try{
  if(e2ePortalJump(b))return true;
  for(const c of endCandidates(adj,i,k)){
   const m=ND[c.j];
   if(m.tank){
    if(!c.kj)continue;
    const cnt=poolCount(c.j);if(cnt>=m.slots)continue;
    b.node=c.j;b.u=cnt;b.v=0;return true;
   }
   /* в камеру выхода вода входит под Умой: Ума всплывает по мере подъёма воды */
   if(!canEnterAt(c.P,b,!!c.virtual,!!m.finish,i))continue;
   if(c.e&&c.e.deviceType==='turnstile'&&c.e._tsT>0)return false;  /* по одному, пауза 0.5 с */
   b.node=c.j;b.u=c.kj?m.L:0;
   if(c.e&&c.e.deviceType==='turnstile')c.e._tsT=TURNSTILE_DELAY;
   return true;
  }
  return false;
 }finally{ballNextType=null;}
}
/* телепорт «ребро-в-ребро»: шарик у врезки портала переносится к паре */
function e2ePortalJump(b){
 if(b.tp>0)return false;
 const q=ballLocal(b);if(!q)return false;
 for(const e of ED){
  if(e.deviceType!=='portal'||!e.pair)continue;
  if(dist3(q,e.vpos)>BALL_R+PIPE_RI*0.45)continue;
  const other=ED.find(o=>o.deviceId===e.pair&&o.deviceType==='portal');
  if(!other)continue;
  const j=nodeById(other.b);if(j<0||!ND[j])continue;
  if(!canEnterAt(other.vpos,b,true,true))return false;
  b.node=j;b.u=clamp(BALL_R+0.02,BALL_R,Math.max(BALL_R,ND[j].L-BALL_R));b.v=0;b.tp=5;
  S.portal&&S.portal();
  return true;
 }
 return false;
}
function dist3(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);}

/* ---------- движение по трубам ---------- */
function slopeAt(n,u){ /* d(height)/du на узле (мировая высота) */
 if(n.L<=1e-9)return 0;
 const e=Math.min(0.01,n.L*0.25);
 const ua=Math.max(0,u-e),ub=Math.min(n.L,u+e);
 if(ub-ua<1e-9)return 0;
 return (worldH(runPoint(n,ub))-worldH(runPoint(n,ua)))/(ub-ua);
}
/* Напор на горизонтальных участках: шарики без уклона не сползают сами. Аналог давления столба:
   если у конца узла жидкость выше, чем у лучшего соседа (его входа или верхнего шарика там),
   на узел действует ускорение к этому концу. Пропорционально перепаду; при выравнивании = 0. */
function drainDrives(adj){
 /* верхний шарик в каждом узле (мировая высота) */
 const tops={};
 for(const o of balls){
  if(o.dead)continue;const q=ballLocal(o);if(!q)continue;
  const h=worldH(q);if(tops[o.node]===undefined||h>tops[o.node])tops[o.node]=h;
 }
 /* самый низкий достижимый сток от конца k узла i (обход по открытым стыкам, глубина до 4) */
 const sinkFrom=(i,k)=>{
  let best=Infinity;const seen=new Set([i]);
  let frontier=[{node:i,k}];
  for(let depth=0;depth<4&&frontier.length;depth++){
   const next=[];
   for(const f of frontier){
    for(const c of endCandidates(adj,f.node,f.k)){
     if(seen.has(c.j))continue;seen.add(c.j);
     const m=ND[c.j];if(!m||(m.tank&&!m.finish))continue;
     const target=Math.max(c.h,tops[c.j]===undefined?-Infinity:tops[c.j]);
     best=Math.min(best,target);
     next.push({node:c.j,k:c.kj?0:1});
    }
   }
   frontier=next;
  }
  return best;
 };
 const res={};
 for(const id in ND){
  const n=ND[id];if(!n||n.tank)continue;
  const d=[0,0];
  for(const k of [0,1]){
   const target=sinkFrom(+id,k);
   if(target===Infinity)continue;
   const endH=worldH(n.pts[k?n.pts.length-1:0]);
   const D=endH-target;
   if(D>0.02){const s=clamp(D/0.25,0,1)*0.8;d[k]=k?s:-s;}
  }
  res[id]=d;
 }
 return res;
}
function movePath(dt,adj){
 for(const b of balls){b.u0=b.u;b.node0=b.node;}
 const drives=drainDrives(adj);
 for(const b of balls){
  if(b.dead||b.type==='ice')continue;
  const n=ND[b.node];if(!n)continue;
  if(b.tp>0)b.tp=Math.max(0,b.tp-dt);
  if(n.tank)continue;
  const s=clamp(slopeAt(n,b.u),-1.2,1.2);
  const dr=drives[b.node];
  const drive=(b.type==='bubble'||b.bubbleRide)?0:(dr?(dr[0]+dr[1])*BALL_GRAVITY:0);
  let a;
  if(b.type==='bubble'){
   /* пузырь всплывает (против градиента высоты); с Умой внутри — только от вентилятора */
   a=b.bubbleBound?0:BALL_GRAVITY*BUBBLE_BUOY*s;
  }
  else if(b.type==='steam')a=BALL_GRAVITY*0.6*s+drive+(n.temperature>=100?BALL_GRAVITY*STEAM_UP:0);
  else a=-BALL_GRAVITY*s+drive;
  /* вентилятор: поток вверх в его кусках (пузырь с Умой и всё остальное) */
  if(fanAtPiece(n)&&(b.type==='bubble'||b.type==='uma'||b.type==='water'))
   a+=BALL_GRAVITY*((b.type==='bubble'&&b.bubbleBound)||b.bubbleRide?FAN_LIFT:0.8);
  /* магнит: магнетит ползёт к активной врезке */
  let mag=false;
  if(b.type==='magnet')mag=magnetPull(b,n);
  const vmax=BALL_MAX_SPEED*(b.type==='uma'?umaSpeedMul:1);
  if(mag){/* скорость задана магнитом */}
  else b.v=clamp((b.v+a*dt)*Math.exp(-BALL_DAMP*dt),-vmax,vmax);
  b.u+=b.v*dt;
  /* свободный пузырь живёт 3 с и лопается */
  if(b.type==='bubble'&&!b.bubbleBound){
   b.life-=dt;
   if(b.life<=0){popBubble(b);continue;}
  }
  if(b.u<0||b.u>n.L){
   const from=b.node,k=b.u<0?0:1;
   if(!tryTransfer(b,from,k,adj)){b.u=clamp(b.u,0,n.L);b.v=0;}
  }
  /* тупик-ловушка держит обычные шарики (Ума и пар проходят) */
  if(n.deadEnd&&b.type!=='uma'&&b.type!=='steam'){
   const mid=n.L*0.5;
   if(Math.abs(b.u-mid)<BALL_SPACING*1.6)b.u=mid+(b.u<mid?-1:1)*BALL_SPACING*1.6;
  }
 }
}
function fanAtPiece(n){
 for(const e of ED)if(e.deviceType==='fan'&&e.active&&(e.a===n.id||e.b===n.id))return true;
 return false;
}
/* тянет магнетит к точке магнита; возвращает true, если скорость задана магнитом */
function magnetPull(b,n){
 for(const e of ED){
  if(e.deviceType!=='magnet'||!e.active)continue;
  const q=ballLocal(b);if(!q)return false;
  if(dist3(q,e.vpos)>=MAGNET_R+PIPE_RI)continue;
  const t=tangentAt(n,b.u);
  const du=(e.vpos[0]-q[0])*t[0]+(e.vpos[1]-q[1])*t[1]+(e.vpos[2]-q[2])*t[2];
  b.v=clamp(du*8,-BALL_MAX_SPEED,BALL_MAX_SPEED);
  return true;
 }
 return false;
}
/* пузырь лопается; если в нём была Ума — она освобождается */
function popBubble(b){
 if(b.dead)return;
 b.dead=true;S.bubble&&S.bubble();
 if(b.bubbleBound){b.bubbleBound.bubbleRide=null;b.bubbleBound=null;toast(T('bubble_pop'),900);}
}
/* касательная трубы в точке u (единичный вектор в сторону роста u) */
function tangentAt(n,u){
 if(n.L<=1e-9)return [1,0,0];
 const e=Math.min(0.01,n.L*0.25);
 const ua=Math.max(0,u-e),ub=Math.min(n.L,u+e);
 const a=runPoint(n,ua),c=runPoint(n,ub);
 const d=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];const l=Math.hypot(d[0],d[1],d[2]);
 return l<1e-9?[1,0,0]:d.map(v=>v/l);
}
/* Контакты шариков (position-based): пары ближе BALL_SPACING разводятся.
   Поправка каждого шарика проецируется на касательную его трубы, поэтому давление
   столба передаётся через изгибы U-образных труб — это и есть «сообщающиеся сосуды».
   Лёд и шарики в камерах неподвижны (вес бесконечный). */
function solvePacking(dt){
 const live=balls.filter(b=>!b.dead&&ND[b.node]);
 const m=live.length;
 const pos=live.map(b=>ballLocal(b));
 const fixed=live.map(b=>b.type==='ice'||!!ND[b.node].tank);
 for(let it=0;it<PBD_ITER;it++){
  let moved=false;
  for(let i=0;i<m;i++){
   for(let j=i+1;j<m;j++){
    const wa=fixed[i]?0:1,wb=fixed[j]?0:1;
    if(wa+wb===0)continue;
    const pa=pos[i],pb=pos[j];
    const dx=pa[0]-pb[0],dy=pa[1]-pb[1],dz=pa[2]-pb[2];
    const d2=dx*dx+dy*dy+dz*dz;
    if(d2>=BALL_SPACING*BALL_SPACING)continue;
    const dist=Math.sqrt(d2);
    const corr=BALL_SPACING-dist;
    const nrm=dist>1e-9?[dx/dist,dy/dist,dz/dist]:tangentAt(ND[live[i].node],live[i].u);
    const sa=wa/(wa+wb)*corr,sb=wb/(wa+wb)*corr;
    if(wa){moveAlong(live[i],nrm,sa);pos[i]=ballLocal(live[i]);}
    if(wb){moveAlong(live[j],nrm,-sb);pos[j]=ballLocal(live[j]);}
    moved=true;
   }
  }
  if(!moved)break;
 }
 /* скорость по итогу шага: смещение по трубе (без перескока в другой узел) */
 for(const b of live){
  if(b.type==='ice'||ND[b.node].tank)continue;
  if(b.node===b.node0)b.v=clamp((b.u-b.u0)/dt,-BALL_MAX_SPEED,BALL_MAX_SPEED);
 }
}
function moveAlong(b,dir,amount){
 const n=ND[b.node];
 const t=tangentAt(n,b.u);
 const du=(dir[0]*t[0]+dir[1]*t[1]+dir[2]*t[2])*amount;

/* камеры: выход шарика с самого низа (слот 0) через порт, если лёд не блокирует */
function stepPools(dt,adj){

  const n=ND[i];if(!n.tank||n.finish)continue;

/* ---------- контакты: кислота, Ума ---------- */
function stepContacts(dt,adj){
 const live=balls.filter(b=>!b.dead);
 const link=ND.map((_,i)=>new Set([i]));
 adj.forEach((list,i)=>{for(const c of list)if(edgeOpen(c.e)&&!(c.e&&c.e.deviceType==='filter'))link[i].add(c.j);});
 const pos=live.map(b=>ballLocal(b));
 const touch=new Set();let waterTouch=false;
 const d2=ACID_CONTACT_DIST*ACID_CONTACT_DIST;
 const neutralize=[];
 for(let p=0;p<live.length;p++){
  const a=live[p],pa=pos[p];if(!pa)continue;
  for(let q=p+1;q<live.length;q++){
   const b=live[q],pb=pos[q];if(!pb)continue;
   if(!link[a.node].has(b.node))continue;
   const dd=(pa[0]-pb[0])**2+(pa[1]-pb[1])**2+(pa[2]-pb[2])**2;
   if(dd>d2)continue;
   if(a.type==='acid'&&(b.type==='water'||b.type==='uma'))touch.add(b);
   if(b.type==='acid'&&(a.type==='water'||a.type==='uma'))touch.add(a);
   /* щёлочь + кислота = нейтрализация (ТЗ §3.2) */
   if((a.type==='alkali'&&b.type==='acid')||(a.type==='acid'&&b.type==='alkali'))neutralize.push([a,b]);
   /* пузырь + Ума = поездка (ТЗ §3.2) */
   if(a.type==='bubble'&&b.type==='uma'&&!a.bubbleBound&&!b.bubbleRide){a.bubbleBound=b;b.bubbleRide=a;a.life=BUBBLE_LIFE;}
   if(b.type==='bubble'&&a.type==='uma'&&!b.bubbleBound&&!a.bubbleRide){b.bubbleBound=a;a.bubbleRide=b;b.life=BUBBLE_LIFE;}
   /* сюрприз + Ума = награда (ТЗ §3.2) */
   if(a.type==='surprise'&&b.type==='uma')applySurprise(a,b);
   if(b.type==='surprise'&&a.type==='uma')applySurprise(b,a);

 }
 /* связка пузырь-Ума рвётся, когда они разошлись */

   if(pair[0].dead||pair[1].dead)continue;
   pair[0].dead=true;pair[1].dead=true;
  }

}
/* сюрприз: +1 вода, +10% скорости Умы, открывает один закрытый шибер, +1 чип */
function applySurprise(sp,uma){

function acidContactSound(){if(!acidAlarm){acidAlarm=true;S.acid();}}

/* ---------- фазы: температура узла определяет состояние шарика ---------- */
function stepPhases(){

  if(b.dead)continue;

  if(b.type==='steam'&&temp<=98&&e2ePortalJump(b))continue;   /* портал срабатывает раньше конденсации */

/* производные свойства узлов из шариков (нужны подсказкам, сохранению, термике, рендеру) */

function stepWin(dt){

function updateThermalDevices(dt){

/* автозадвижки: турникет-кулдаун + таймер (ТЗ §4.2) */
function stepAutoGates(dt){

  e._tgT=(e._tgT||0)+dt;
  if(e._tgT>=e.timer){

/* дозатор: пока включён, выпускает шарик каждые N секунд (ТЗ §4.2) */
function stepDispensers(dt){

  if(e.deviceType!=='dispenser'||!e.active)continue;
  e._dspT=(e._dspT||0)+dt;
  if(e._dspT<(e.every||2))continue;

  const u=clamp(BALL_R+0.01,BALL_R,Math.max(BALL_R,n.L-BALL_R));

/* магнит: магнетит, замерший строго под втяжкой, затягивается в колодец */
function stepMagnets(){
 for(const e of ED){
  if(e.deviceType!=='magnet'||!e.active)continue;
  const ai=nodeById(e.a);if(ai<0||!ND[ai])continue;
  for(const b of balls){
   if(b.dead||b.type!=='magnet')continue;
   const n=ND[b.node];if(!n||n.tank)continue;
   if(n.id===e.a||n.id===e.b)continue;
   const q=ballLocal(b);if(!q)continue;
   if(Math.abs(q[0]-e.vpos[0])>0.05||q[1]>e.vpos[1])continue;
   if(dist3(q,e.vpos)>MAGNET_R+PIPE_RI)continue;
   if(!canEnterAt(e.vpos,b,true,true))continue;
   b.node=ai;b.u=Math.min(BALL_R,Math.max(BALL_R,ND[ai].L-BALL_R));b.v=0;

/* весы: при ровно N шариках открывают свой шибер (ТЗ §4.2) */
function stepScales(){
 for(const e of ED){
  if(e.deviceType!=='scale')continue;
  const list=(e.nodes&&e.nodes.length?e.nodes:[e.nodeId]).filter(Boolean);
  if(!list.length)continue;
  let c=0;
  for(const b of balls){
   if(b.dead||b.type==='uma')continue;
   const n=ND[b.node];
   if(n&&list.indexOf(n.sourceId)>=0)c++;

  if(!g)return;

  else if(g.open&&c===0){if(!gateCloseBlocked(g)&&!umaNearGate(g))g.open=false;}
 }
}
/* Ума рядом с задвижкой? (автозакрытие весов не срабатывает у неё перед носом) */
function umaNearGate(g){
 const u=balls.find(b=>!b.dead&&b.type==='uma');if(!u)return false;
 const ai=nodeById(g.a),bi=nodeById(g.b);
 if(u.node!==ai&&u.node!==bi)return false;

}
/* нельзя закрыть, если над задвижкой жидкость (кроме Умы) или лёд рядом */
function gateCloseBlocked(e){

/* порт узла для рисования «ледяных колец» (ближайшая пара концов) */

/* ---------- шаг симуляции (30 Гц) ---------- */

/* ================= главный цикл ====================================== */
let lastT=0,acc=0,statT=0,dtFrame=1/60,renderAlpha=0;
let perfTier=0,perfHold=0;   /* 0 полный · 1 без дымки/партиклов · 2 +сим 20 Гц · 3 +упрощённые трубы */
function updatePerfTier(dt){
 const want=fpsE>=30?0:fpsE>=20?1:fpsE>=15?2:3;
 if(want>perfTier){perfHold+=dt;if(perfHold>1.2){perfTier=want;perfHold=0;}}
 else if(want<perfTier){perfHold-=dt;if(perfHold<-3){perfTier=Math.max(0,want);perfHold=0;}}
 else perfHold=0;
}
function frame(ts){
 requestAnimationFrame(frame);
 const t=ts/1000;
 let dt=Math.min(0.05,t-lastT||0.016);lastT=t;
 dtFrame=dt;fps=1/dt;fpsE+= (fps-fpsE)*0.06;
 if(toastT>0){toastT-=dt;if(toastT<=0)document.getElementById('toast').style.display='none';}
 if(gameScreen()&&!paused){
  if(W<4||H<4)resize();
  /* Arcball inertia, braking threshold and a 0.4 s eased reset. */
  if(rot.resetActive){rot.resetT=Math.min(.4,rot.resetT+dt);const x=rot.resetT/.4,ease=1-Math.pow(1-x,3);rot.q=qSlerp(rot.resetFrom,[0,0,0,1],ease);if(x>=1){rot.q=[0,0,0,1];rot.resetActive=false;rot.speed=0;}}
  else if(!drag&&rot.speed>1e-4){
   rot.q=qNormalize(qMultiply(qAxisAngle(rot.axis,rot.speed*dt),rot.q));
   rot.speed*=Math.exp(-ROT_DAMP*Math.min(.25,dt));if(rot.speed<.02)rot.speed=0;
  }
  labYaw=qYaw(rot.q);
  updatePerfTier(dt);
  const simHz=perfTier>=2?20:SIM_HZ;
  acc+=dt;let n=0;
  while(acc>=1/simHz&&n<4){simStep(1/simHz);acc-=1/simHz;n++;}
  if(acc>0.2)acc=0;
  renderAlpha=clamp(acc*SIM_HZ,0,1);computeHeights();
  hitZones.length=0;
  render(t);rebuildHitZoneCache();
  updateHint(dt);
  drawHintArrow(t);
  const af=document.getElementById('acidFrame');
  if(af)af.classList.toggle('on',acidNearUma());
  /* кольцо заморозки */
  const fr=document.getElementById('freezeArc');
  fr.setAttribute('stroke-dashoffset',(62.8*(1-freezeLeft/FREEZE_TIME)).toFixed(1));
  document.getElementById('btn-freeze').classList.toggle('hot',freezeOn);
  statT+=dt;if(statT>0.25){statT=0;paintStats();}
 } else {
  hitZones.length=0;hitZoneCache.clear();
 }
}

let modsState='water',modsBuilt=false;
function renderMods(){
 const $=id=>document.getElementById(id);
 const dark=document.documentElement.dataset.theme==='dark';
 if(!modsBuilt){
  const bar=$('mods-bar');
  PLIB.STATES.forEach(st=>{
   const b=document.createElement('button');b.type='button';b.dataset.st=st;
   b.innerHTML='<span class="dot" style="background:'+PLIB.STATE_COL[st]+'"></span>'+(LANG==='ru'?PLIB.STATE_RU[st]:PLIB.STATE_EN[st]);
   b.addEventListener('click',()=>{S.click();modsState=st;renderMods();});
   bar.appendChild(b);
  });
  const grid=$('mods-grid');
  PLIB.MODULES.forEach(m=>{
   const cell=document.createElement('div');cell.className='mod-cell';
   const cv2=document.createElement('canvas');cv2.width=460;cv2.height=250;
   cell.appendChild(cv2);
   const nm=document.createElement('div');nm.className='mname';nm.textContent=m.ru+' · '+m.size;
   const mm=document.createElement('div');mm.className='mmeta';mm.textContent=(m.en||m.id)+' · '+(T('hk30'))+': '+m.ports;
   cell.appendChild(nm);cell.appendChild(mm);
   cell._cv=cv2;cell._m=m;
   grid.appendChild(cell);
  });
  modsBuilt=true;
 }
[...$('mods-bar').children].forEach(b=>b.classList.toggle('on',b.dataset.st===modsState));
[...$('mods-grid').children].forEach(cell=>{
  const g2=cell._cv.getContext('2d');
  g2.clearRect(0,0,cell._cv.width,cell._cv.height);
  let sc=190,wOut=46,wIn=35;
  let geo=PLIB.modGeometry(cell._m.id,{scale:sc,wOut:wOut,wIn:wIn});
  const k=Math.min(1,(cell._cv.width-60)/(geo.bb[2]-geo.bb[0]),(cell._cv.height-40)/(geo.bb[3]-geo.bb[1]));
  sc*=k;wOut*=k;wIn*=k;
  PLIB.drawModule(g2,cell._m.id,cell._cv.width/2,cell._cv.height/2,
   {state:modsState,scale:sc,wOut:wOut,wIn:wIn,t:modsT()/1000,dark:dark,seed:cell._m.id});
 });
}
